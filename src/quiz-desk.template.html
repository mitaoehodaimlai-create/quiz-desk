<title>Quiz Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one working column under a slim top bar; faculty tabs on the left of the bar, OMR-sheet bubbles as the recurring motif. */
:root{
  --paper:#f4f5f8; --sheet:#ffffff; --ink:#17202d; --muted:#5b6677; --line:#dde1e9; --line-strong:#c6ccd8;
  --pen:#2546b8; --pen-ink:#ffffff; --pen-soft:#e7ecfb;
  --omr:#c0245e; --omr-soft:#fbe8ef;
  --ok:#1d7a4c; --ok-soft:#e3f4ea; --warn:#9a5c00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10141b; --sheet:#171c25; --ink:#e6e9ef; --muted:#9aa3b3; --line:#283040; --line-strong:#3a4456;
  --pen:#8fa6ff; --pen-ink:#0e1430; --pen-soft:#1e2846;
  --omr:#f2709f; --omr-soft:#3a1a27;
  --ok:#5cc892; --ok-soft:#14301f; --warn:#e8ac4c; --warn-soft:#33270f; --bad:#ff8f86; --bad-soft:#3a1715;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#10141b; --sheet:#171c25; --ink:#e6e9ef; --muted:#9aa3b3; --line:#283040; --line-strong:#3a4456;
  --pen:#8fa6ff; --pen-ink:#0e1430; --pen-soft:#1e2846;
  --omr:#f2709f; --omr-soft:#3a1a27;
  --ok:#5cc892; --ok-soft:#14301f; --warn:#e8ac4c; --warn-soft:#33270f; --bad:#ff8f86; --bad-soft:#3a1715;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.15; text-wrap:balance; margin:0}
h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--pen); outline-offset:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--sheet); border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px; margin:0 auto; padding-inline:16px; display:flex; align-items:center; gap:16px; min-height:58px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.15rem}
.brand-mark{display:grid; grid-template-columns:repeat(3,7px); gap:3px}
.brand-mark i{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--omr)}
.brand-mark i.f{background:var(--omr)}
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tab{border:0; background:none; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500}
.tab:hover{background:var(--paper); color:var(--ink)}
.tab[aria-selected="true"]{background:var(--pen-soft); color:var(--pen)}
.tab .count{font-family:var(--mono); font-size:.78rem; margin-left:4px; opacity:.8}
.bar-end{margin-left:auto; display:flex; gap:8px; align-items:center}
.role{font-size:.78rem; padding:3px 9px; border-radius:99px; border:1px solid var(--line-strong); color:var(--muted)}

main{max-width:1120px; margin:0 auto; padding-inline:16px; padding-block:24px 64px; display:flex; flex-direction:column; gap:20px}
.notice{border:1px dashed var(--line-strong); border-radius:var(--r); padding:10px 14px; font-size:.88rem; color:var(--muted); background:var(--sheet)}

.panel{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.panel-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:20px; align-items:start}
@media (max-width:860px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* buttons & fields */
.btn{border:1px solid var(--line-strong); background:var(--sheet); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; display:inline-flex; gap:6px; align-items:center; white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--pen); border-color:var(--pen); color:var(--pen-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.ghost{border-color:transparent; background:none}
.btn.ghost:hover{background:var(--paper)}
.btn.sm{padding:4px 10px; font-size:.84rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field > span{font-size:.82rem; font-weight:500; color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{border:1px solid var(--line-strong); background:var(--sheet); border-radius:8px; padding:8px 10px; width:100%; min-width:0}
textarea{font-family:var(--mono); font-size:.82rem; min-height:120px; resize:vertical}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.check{display:flex; gap:8px; align-items:center; font-size:.9rem; cursor:pointer}

/* drop zone */
.drop{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:22px 16px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; cursor:pointer; background:var(--paper)}
.drop.over{border-color:var(--pen); background:var(--pen-soft)}
.drop strong{font-family:var(--display); font-size:1.05rem}
.cols{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.chip{font-family:var(--mono); font-size:.75rem; padding:2px 7px; border-radius:5px; background:var(--sheet); border:1px solid var(--line)}
.chip.opt{border-style:dashed; color:var(--muted)}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:.75rem; font-weight:600; padding:2px 9px; border-radius:99px; letter-spacing:.02em; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.live{color:var(--ok); background:var(--ok-soft)}
.pill.draft{color:var(--muted); background:var(--paper); border:1px solid var(--line)}
.pill.closed{color:var(--warn); background:var(--warn-soft)}
.pill.bad{color:var(--bad); background:var(--bad-soft)}
.pill.info{color:var(--pen); background:var(--pen-soft)}
.diff-easy{color:var(--ok)} .diff-medium{color:var(--warn)} .diff-hard{color:var(--bad)}

/* tables */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
table{border-collapse:collapse; width:100%; font-size:.9rem}
th,td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--paper); position:sticky; top:0}
td.wrap{white-space:pre-wrap; overflow-wrap:anywhere; min-width:260px; max-width:640px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.scroll{max-height:440px; overflow:auto}

.issues{display:flex; flex-direction:column; gap:4px; font-size:.86rem; max-height:150px; overflow:auto; padding:10px 12px; border-radius:8px; background:var(--warn-soft); color:var(--warn)}
.issues.ok{background:var(--ok-soft); color:var(--ok)}

/* stats */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.stat{border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:2px}
.stat b{font-family:var(--display); font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums}

/* question cards in bank */
.qlist{display:flex; flex-direction:column; gap:10px}
.qcard{border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.qcard-top{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.qmeta{display:flex; gap:10px; flex-wrap:wrap; font-size:.78rem; color:var(--muted)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:4px 16px; font-size:.88rem}
.opts div{display:flex; gap:8px; align-items:baseline}
.opts .right{color:var(--ok); font-weight:600}

/* OMR bubble */
.bub{flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--omr); color:var(--omr); display:inline-grid; place-items:center; font-family:var(--mono); font-size:.78rem; font-weight:500}
.bub.sm{width:20px; height:20px; font-size:.68rem}
.bub.fill{background:var(--omr); color:var(--sheet)}
.bub.ok{border-color:var(--ok); color:var(--ok)} .bub.ok.fill{background:var(--ok); color:var(--sheet)}
.bub.no{border-color:var(--bad); color:var(--bad)} .bub.no.fill{background:var(--bad); color:var(--sheet)}

/* quiz cards */
.quizzes{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.qz{border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--sheet)}
.qz-facts{display:flex; gap:14px; flex-wrap:wrap; font-size:.84rem; color:var(--muted)}
.qz-facts b{color:var(--ink); font-family:var(--mono); font-weight:500}
.qz-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:4px}

.bars{display:flex; flex-direction:column; gap:6px}
.barrow{display:grid; grid-template-columns:44px minmax(0,1fr) 46px; gap:10px; align-items:center; font-size:.84rem}
.track{height:10px; background:var(--paper); border-radius:5px; overflow:hidden; border:1px solid var(--line)}
.track i{display:block; height:100%; background:var(--pen)}
.track i.low{background:var(--bad)}

.empty{text-align:center; padding:28px 16px; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:center}
.empty h3{color:var(--ink)}

/* student exam screen */
.exam{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:20px; align-items:start}
@media (max-width:820px){ .exam{grid-template-columns:minmax(0,1fr)} }
.exam-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.timer{font-family:var(--mono); font-size:1.5rem; font-variant-numeric:tabular-nums; padding:4px 12px; border-radius:8px; border:1px solid var(--line-strong)}
.timer.low{color:var(--bad); border-color:var(--bad); background:var(--bad-soft)}
.qtext{font-size:1.12rem; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
.qtxt{white-space:pre-wrap; overflow-wrap:anywhere}
.choice span:last-child{white-space:pre-wrap; overflow-wrap:anywhere; min-width:0}
.qacc{display:flex; flex-direction:column; gap:4px; padding-block:8px; border-bottom:1px solid var(--line)}
.qacc:last-child{border-bottom:0}
.choices{display:flex; flex-direction:column; gap:8px}
.choice{display:flex; gap:12px; align-items:center; text-align:left; width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--sheet); cursor:pointer}
.choice:hover{border-color:var(--omr)}
.choice[aria-pressed="true"]{border-color:var(--omr); background:var(--omr-soft)}
.choice[aria-pressed="true"] .bub{background:var(--omr); color:var(--sheet)}
.palette{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px}
.pal{height:38px; border-radius:7px; border:1px solid var(--line-strong); background:var(--sheet); cursor:pointer; font-family:var(--mono); font-size:.85rem; position:relative}
.pal.ans{background:var(--omr); border-color:var(--omr); color:var(--sheet)}
.pal.cur{outline:2px solid var(--pen); outline-offset:1px}
.pal.mark::after{content:""; position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--warn)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.78rem; color:var(--muted)}
.legend span{display:inline-flex; gap:5px; align-items:center}
.legend i{width:12px; height:12px; border-radius:3px; border:1px solid var(--line-strong); display:inline-block}
.exam,.exam-head{-webkit-user-select:none; user-select:none}
.warnbar{position:sticky; top:calc(env(safe-area-inset-top,0px) + 66px); z-index:4; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:12px 16px; border-radius:var(--r); background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad); font-size:.92rem}
.warnbar div{min-width:0; flex:1 1 260px}
.confirm{border:1px solid var(--omr); background:var(--omr-soft); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:10px}

.review{display:flex; flex-direction:column; gap:10px}
.review .qcard.right{border-left:3px solid var(--ok)}
.review .qcard.wrong{border-left:3px solid var(--bad)}
.scorebig{font-family:var(--display); font-size:3rem; font-weight:700; line-height:1}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; font-size:.9rem; z-index:20; max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translate(-50%,8px); opacity:0}} }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i><i class="f"></i><i></i></span>Quiz Desk <span class="role" id="groupChip" style="font-family:var(--body)"></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="bar-end" id="barEnd"></div>
</div></header>
<main id="view"><div class="empty"><h3>Opening Quiz Desk…</h3></div></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- this copy's group: each group is its own artifact with its own link and database ---------- */
// url is this group's claude.ai link, filled in at build time from groups.json (kept out of git).
const GROUP = { name: '__GROUP__', limit: 30, url: '__URL__' };
const STUDENT_LINK = GROUP.url && !GROUP.url.startsWith('__') ? GROUP.url + '#student' : '';

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const clone = o => JSON.parse(JSON.stringify(o));
const LETTERS = ['A','B','C','D','E','F'];
const fmtTime = ms => { const s = Math.max(0, Math.round(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const fmtDate = t => t ? new Date(t).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, rand){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- in-tab fallback store (used only when the shared database is unavailable) ---------- */
function memoryDB(){
  const docs = new Map(), subs = new Set();
  const notify = () => setTimeout(() => subs.forEach(f => f()));
  const snap = p => { const d = docs.get(p); return { id: p.split('/').pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: {} }; };
  const docRef = p => ({ id: p.split('/').pop(), path: p,
    get: async () => snap(p),
    set: async d => { docs.set(p, clone(d)); notify(); },
    update: async d => { if (!docs.has(p)) throw { code: 'invalid_argument' }; docs.set(p, { ...docs.get(p), ...clone(d) }); notify(); },
    delete: async () => { docs.delete(p); notify(); },
    onSnapshot(next){ const f = () => next(snap(p)); subs.add(f); setTimeout(f); return () => subs.delete(f); } });
  const colRef = p => { const depth = p.split('/').length + 1;
    const list = () => [...docs.keys()].filter(k => k.startsWith(p + '/') && k.split('/').length === depth).sort().map(snap);
    const query = (field, dir, n) => ({
      orderBy: (f, d) => query(f, d || 'asc', n), limit: m => query(field, dir, m),
      get: async () => {
        let d = list();
        if (field) d.sort((a, b) => ((a.data()[field] ?? 0) - (b.data()[field] ?? 0)) * (dir === 'desc' ? -1 : 1));
        if (n) d = d.slice(0, n);
        return { docs: d, size: d.length, empty: !d.length };
      } });
    return { path: p, doc: id => docRef(p + '/' + (id || rid())),
      add: async d => { const r = docRef(p + '/' + rid()); await r.set(d); return r; },
      orderBy: (f, d) => query(f, d || 'asc'), limit: n => query(null, null, n),
      get: async () => { const d = list(); return { docs: d, size: d.length, empty: !d.length }; },
      onSnapshot(next){ const f = () => { const d = list(); next({ docs: d, size: d.length, empty: !d.length, docChanges: () => [] }); }; subs.add(f); setTimeout(f); return () => subs.delete(f); } }; };
  return { doc: docRef, collection: colRef };
}

/* ---------- state ---------- */
const S = {
  ready: false, local: false, db: null, downloads: null, uid: null,
  isTeacher: false, view: 'teacher', tab: store('qd.tab') || 'students',
  roster: [], bank: [], keys: {}, quizzes: [], subs: [], mySub: null,
  index: [], full: {}, subsWatch: null, quizzesLoaded: false, indexLoaded: false,
  pending: null,             // parsed upload awaiting confirmation {kind, rows, issues, mode}
  bankFilter: { q: '', topic: '', diff: '' }, rosterFilter: '',
  builder: { title: '', duration: 20, count: 10, topics: [], diff: '', divisions: [], shuffle: true, penalty: 1, free: 1, maxV: 5 },
  preStart: null,
  faculty: null, me: null, activity: null, activityWho: '', resetFor: null, staffLoaded: false, isOwner: false, unlocked: false, lockErr: '', fails: 0, lockedUntil: 0, confirmReset: false, pwPanel: false,
  resultsQuiz: null, confirmDelete: null,
  la: { scope: 'all', lo: 40, hi: 75 },   // learner analytics: slow below lo %, advanced from hi %
  roll: store('qd.roll') || '', take: null, studentScreen: 'list', reviewQuiz: null,
};
let dirty = false;
function soft(){ // re-render unless the person is typing in a field or sitting an exam
  if (S.take) { if (S.take && checkClosed()) return; renderTabs(); return; }
  const a = document.activeElement;
  if (a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { dirty = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (dirty){ dirty = false; soft(); } }, 0));

/* ---------- boot ---------- */
async function boot(){
  let db = null, user = null, dl = null;
  if (window.claude?.use){
    [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
  }
  S.downloads = dl;
  if (db){
    S.db = db;
    S.uid = user ? await user.id() : null;
    S.isTeacher = user ? await user.canEdit() : false;
    S.isOwner = user ? await user.isOwner() : false;
  } else {
    S.db = memoryDB(); S.local = true; S.uid = 'preview-' + rid(); S.isTeacher = true; S.isOwner = true;
  }
  S.view = S.isTeacher ? (store('qd.view') || 'teacher') : 'student';
  // The student link (the group's address + #student) always opens the quiz screen, never the faculty login.
  S.studentLink = /^#student$/i.test(location.hash || '');
  if (S.studentLink) S.view = 'student';
  subscribe();
  S.ready = true; render();
}
function onErr(e){ if (e?.code === 'revoked') toast('Access to this quiz desk changed. Reload to continue.'); }
function subscribe(){
  const db = S.db;
  if (S.isTeacher){
    db.collection('staff').onSnapshot(snap => {
      S.keys = {}; S.faculty = []; S.staffLoaded = true;
      for (const d of snap.docs){
        const v = d.data() || {};
        if (d.id === 'faculty') S.faculty = v.accounts || [];

        else if (d.id.startsWith('key_')) S.keys[d.id.slice(4)] = v;
      }

    db.collection('quizzes').onSnapshot(snap => {

  }, onErr);
  if (S.uid) loadMySub().then(soft);

/* ---------- parsing uploads ---------- */
function parseCSV(text){
  const lines = text.replace(/\r\n?/g, '\n');
  const first = lines.split('\n')[0] || '';
  const delim = (first.split('\t').length > first.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < lines.length; i++){
    const c = lines[i];
    if (q){ if (c === '"'){ if (lines[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
async function fileRows(file){
  if (window.XLSX){
    const wb = XLSX.read(await file.arrayBuffer());
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false }).filter(r => r.some(x => String(x).trim()));
  }
  if (/\.(csv|txt|tsv)$/i.test(file.name)) return parseCSV(await file.text());
  throw new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead.');
}
const findCol = (heads, aliases) => heads.findIndex(h => aliases.includes(h));
const STUDENT_COLS = {
  roll: ['roll','rollno','rollnumber','prn','prnno','prnnumber','enrollment','enrollmentno','enrolmentno','studentid','regno','registrationno','usn','id'],
  name: ['name','studentname','fullname','student','nameofstudent'],
  email: ['email','emailid','mail','emailaddress','mailid'],
  division: ['division','div','batch','class','section','branch','group'],
};
function parseStudents(rows){
  const heads = (rows[0] || []).map(norm), issues = [];
  const ix = Object.fromEntries(Object.entries(STUDENT_COLS).map(([k, a]) => [k, findCol(heads, a)]));
  if (ix.roll < 0) return { error: 'No roll number column found. Name the header "Roll No" or "PRN".' };
  if (ix.name < 0) issues.push('No name column found; students will be listed by roll number only.');
  const out = [], seen = new Set();
  rows.slice(1).forEach((r, i) => {
    const roll = String(r[ix.roll] ?? '').trim().toUpperCase();
    if (!roll){ issues.push(`Row ${i + 2}: missing roll number, skipped.`); return; }
    if (seen.has(roll)){ issues.push(`Row ${i + 2}: roll ${roll} repeats an earlier row, skipped.`); return; }
    seen.add(roll);
    out.push({ roll, name: ix.name >= 0 ? String(r[ix.name]).trim() : '', email: ix.email >= 0 ? String(r[ix.email]).trim() : '', division: ix.division >= 0 ? String(r[ix.division]).trim().toUpperCase() : '' });
  });
  return { rows: out, issues };
}
const Q_COLS = {
  text: ['question','questiontext','q','text','stem','questions'],
  answer: ['answer','correct','correctanswer','key','ans','correctoption','answerkey','rightanswer'],
  topic: ['topic','unit','chapter','module','subject','co','courseoutcome'],
  diff: ['difficulty','level','difficultylevel','diff'],
  marks: ['marks','mark','points','score','weight','weightage'],
};
const OPT_COLS = LETTERS.slice(0, 6).map((L, i) => { const l = L.toLowerCase(), n = i + 1; return [l, 'option' + l, 'opt' + l, 'choice' + l, 'option' + n, 'opt' + n, 'choice' + n, 'o' + n]; });
function normDiff(v){ const s = norm(v); if (!s) return 'medium'; if (/^(e|1|low)/.test(s)) return 'easy'; if (/^(h|3|high|diff)/.test(s)) return 'hard'; return 'medium'; }
function parseQuestions(rows){
  const heads = (rows[0] || []).map(norm), issues = [];
  const ix = Object.fromEntries(Object.entries(Q_COLS).map(([k, a]) => [k, findCol(heads, a)]));
  const optIx = OPT_COLS.map(a => findCol(heads, a)).filter(i => i >= 0);
  if (ix.text < 0) return { error: 'No question column found. Name the header "Question".' };
  if (optIx.length < 2) return { error: 'Need at least two option columns, named A, B, C, D (or Option A … Option D).' };
  if (ix.answer < 0) return { error: 'No answer column found. Name the header "Answer" and put A–D (or the option text) in it.' };
  const out = [];
  rows.slice(1).forEach((r, i) => {
    const text = String(r[ix.text] ?? '').trim();
    if (!text){ issues.push(`Row ${i + 2}: empty question, skipped.`); return; }
    const options = optIx.map(j => String(r[j] ?? '').trim()).filter(Boolean);
    if (options.length < 2){ issues.push(`Row ${i + 2}: fewer than two options, skipped.`); return; }
    const raw = String(r[ix.answer] ?? '').trim();
    let answer = -1;
    if (/^[a-f]$/i.test(raw)) answer = LETTERS.indexOf(raw.toUpperCase());
    else if (/^(option\s*)?[a-f]$/i.test(raw)) answer = LETTERS.indexOf(raw.slice(-1).toUpperCase());
    else if (/^\d$/.test(raw)) answer = +raw - 1;
    else answer = options.findIndex(o => norm(o) === norm(raw));
    if (answer < 0 || answer >= options.length){ issues.push(`Row ${i + 2}: answer "${raw || 'blank'}" doesn't match an option, skipped.`); return; }
    const marks = ix.marks >= 0 ? parseFloat(r[ix.marks]) : NaN;
    out.push({ id: 'q' + rid(), text, options, answer, topic: ix.topic >= 0 ? String(r[ix.topic]).trim() || 'General' : 'General', difficulty: ix.diff >= 0 ? normDiff(r[ix.diff]) : 'medium', marks: marks > 0 ? marks : 1 });
  });
  return { rows: out, issues };
}
async function handleUpload(kind, source){
  try {
    const rows = typeof source === 'string' ? parseCSV(source) : await fileRows(source);
    if (rows.length < 2) throw new Error('The file has a header row but no data rows.');
    const res = kind === 'students' ? parseStudents(rows) : parseQuestions(rows);
    if (res.error) throw new Error(res.error);
    S.pending = { kind, rows: res.rows, issues: res.issues, mode: 'merge', name: typeof source === 'string' ? 'Pasted text' : source.name };
  } catch (e){ S.pending = { kind, error: e.message || String(e) }; }
  render();
}

/* ---------- proctoring rules ---------- */
const PROCTOR_DEFAULT = { penalty: 1, free: 1, maxV: 5 };
const VIOL_LABEL = { tab: 'Left the quiz tab or window', copy: 'Tried to copy text', cut: 'Tried to cut text', paste: 'Tried to paste text', menu: 'Opened the right-click menu', drop: 'Dragged in content from elsewhere', fullscreen: 'Left full screen', screenshot: 'Pressed Print Screen' };
function proctorOf(quiz){ return { ...PROCTOR_DEFAULT, ...(quiz.proctor || {}) }; }
function penaltyOf(quiz, a){
  const p = proctorOf(quiz), v = (a?.violations || []).length;
  return { v, ded: Math.max(0, v - p.free) * p.penalty, p };
}
function rulesText(quiz){
  const p = proctorOf(quiz);
  return `Switching tabs or windows, copying, pasting, right-clicking, or bringing in content from other websites is recorded as a violation. ${p.free ? `The first ${p.free === 1 ? 'one is a warning' : p.free + ' are warnings'}; after that, ` : 'Each one '}${p.penalty ? `costs ${p.penalty} mark${p.penalty == 1 ? '' : 's'} each` : 'is reported to your teacher'}.${p.maxV ? ` After ${p.maxV} violations the quiz is submitted automatically.` : ''}`;
}

function divisionsOf(roster){ return [...new Set(roster.map(s => s.division).filter(Boolean))].sort(); }
function builderPool(){

async function createQuiz(){

  if (!assigned.length) return toast('Upload the student list first, or pick a division that has students.');

    questions: picked.map(q => ({ id: q.id, text: q.text, options: q.options, marks: q.marks, topic: q.topic })),
    totalMarks: picked.reduce((a, q) => a + (+q.marks || 1), 0),

    proctor: { penalty: Math.max(0, +b.penalty || 0), free: Math.max(0, Math.floor(+b.free || 0)), maxV: Math.max(0, Math.floor(+b.maxV || 0)) },

/* ---------- results ---------- */
function results(quiz){
  const key = S.keys[quiz.id]?.answers || quiz.key || {};
  const rosterMap = new Map(S.roster.map(s => [s.roll, s]));
  const rows = [];
  for (const sub of S.subs){
    const a = sub.attempts?.[quiz.id]; if (!a) continue;
    let score = 0, correct = 0, attempted = 0;
    for (const q of quiz.questions){
      const v = a.answers?.[q.id];
      if (v !== undefined && v !== null){ attempted++; if (v === key[q.id]){ score += +q.marks || 1; correct++; } }
    }
    const pen = penaltyOf(quiz, a), raw = score;
    const tabEv = (a.violations || []).filter(v => v.t === 'tab');
    const tabs = tabEv.length, awaySecs = tabEv.reduce((s, v) => s + (v.secs || 0), 0);
    score = Math.max(0, raw - pen.ded);
    rows.push({ uid: sub.id, roll: a.roll, name: rosterMap.get(a.roll)?.name || '', division: rosterMap.get(a.roll)?.division || '', score, raw, tabs, awaySecs, viol: pen.v, ded: pen.ded, violations: a.violations || [], correct, attempted,
      pct: pct(score, quiz.totalMarks), submitted: !!a.submittedAt, auto: !!a.auto, startedAt: a.startedAt, submittedAt: a.submittedAt,
      taken: a.submittedAt ? a.submittedAt - a.startedAt : null, answers: a.answers || {}, onList: quiz.allowedRolls.includes(a.roll) });
  }
  const counts = {}; rows.forEach(r => counts[r.roll] = (counts[r.roll] || 0) + 1);
  rows.forEach(r => r.dup = counts[r.roll] > 1);
  rows.sort((a, b) => b.score - a.score || (a.taken ?? 9e15) - (b.taken ?? 9e15));
  const seen = new Set(rows.map(r => r.roll));
  const missing = quiz.allowedRolls.filter(r => !seen.has(r));
  const perQ = quiz.questions.map(q => { const done = rows.filter(r => r.submitted); const c = done.filter(r => r.answers[q.id] === key[q.id]).length; return { q, rate: done.length ? c / done.length : 0, n: done.length }; });
  return { rows, missing, perQ, key };
}
async function exportCSV(quiz){
  const { rows, missing } = results(quiz);
  const cell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const lines = [['Rank','Roll No','Name','Division','Final score','Out of','Percent','Marks before penalty','Tab switches','Time away (s)','Violations','Marks deducted','Violation details','Correct','Attempted','Status','Time taken','Submitted at'].join(',')];
  const vdet = r => r.violations.map(v => `${VIOL_LABEL[v.t] || v.t} at ${new Date(v.at).toLocaleTimeString()}${v.secs ? ` (${v.secs}s away)` : ''}`).join('; ');
  rows.forEach((r, i) => lines.push([i + 1, r.roll, r.name, r.division, r.score, quiz.totalMarks, r.pct, r.raw, r.tabs, r.awaySecs, r.viol, r.ded, vdet(r), r.correct, r.attempted, r.submitted ? (r.auto ? 'Auto-submitted' : 'Submitted') : 'In progress', r.taken ? fmtTime(r.taken) : '', r.submittedAt ? new Date(r.submittedAt).toISOString() : ''].map(cell).join(',')));
  const rm = new Map(S.roster.map(s => [s.roll, s]));
  missing.forEach(roll => lines.push(['', roll, rm.get(roll)?.name || '', rm.get(roll)?.division || '', 0, quiz.totalMarks, 0, 0, 0, 0, 0, 0, '', 0, 0, 'Absent', '', ''].map(cell).join(',')));
  const csv = lines.join('\n'), filename = GROUP.name.replace(/\s+/g, '-') + '-' + quiz.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '-results.csv';
  if (S.downloads){
    try { await S.downloads.save({ filename, data: csv }); toast('Results saved as CSV.'); return; }
    catch (e){ if (e?.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(csv); toast('Copied results as CSV. Paste into Excel or Sheets.'); }
  catch { toast('Couldn\'t export from this view.'); }
}

/* ---------- faculty accounts ----------
   Each faculty member has a username and password. Accounts live in staff/faculty, which only
   the artifact's editors can read; passwords are stored only as salted PBKDF2-SHA-256 hashes.
   The first account created is the administrator, who adds, resets, disables and removes the
   others. Every login and quiz action is written to staff/log/entries with the faculty member's name. */
const SESS_KEY = 'qd.faculty.' + GROUP.name, SESSION_HOURS = 8, PBKDF2_ITER = 210000;
function sess(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { return null; } }
const b64e = u8 => btoa(String.fromCharCode(...u8));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPassword(pass, salt, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(salt), iterations: iter }, key, 256);
  return b64e(new Uint8Array(bits));
}
async function makeSecret(pass){ const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); return { salt, iter: PBKDF2_ITER, hash: await hashPassword(pass, salt, PBKDF2_ITER), setAt: Date.now() }; }
const normUser = u => String(u || '').trim().toLowerCase();
function checkUnlock(){
  // A login lasts 8 hours in this browser tab. Resetting, disabling or removing the account ends it.
  let s = null; try { s = JSON.parse(sess(SESS_KEY) || 'null'); } catch {}
  const acc = s && (S.faculty || []).find(a => a.username === s.u && !a.disabled);
  S.unlocked = !!(S.isTeacher && S.staffLoaded && acc && s.until > Date.now() && s.v === acc.setAt);
  S.me = S.unlocked ? acc : null;
}
function startSession(acc){ sess(SESS_KEY, JSON.stringify({ u: acc.username, v: acc.setAt, until: Date.now() + SESSION_HOURS * 3600000 })); S.lockErr = ''; S.fails = 0; }
async function saveFaculty(accounts, msg){ await write(() => S.db.doc('staff/faculty').set({ accounts, updatedAt: Date.now() }), msg); S.faculty = accounts; }
async function logAct(action, detail){
  if (!S.me && action !== 'Logged in') return;
  const who = S.me || {};
  try { await S.db.collection('staff/log/entries').add({ at: Date.now(), user: who.username || '', name: who.name || '', action, detail: detail || '' }); } catch {}
}
function pwProblem(p, p2){ if (p.length < 8) return 'Use at least 8 characters for the password.'; if (p !== p2) return 'The two passwords don\'t match.'; return ''; }
function userProblem(name, username, accounts){
  if (!name.trim()) return 'Enter the faculty member\'s name.';
  if (!/^[a-z0-9._-]{3,32}$/.test(username)) return 'Username: 3–32 characters, letters, digits, dot, dash or underscore.';
  if (accounts.some(a => a.username === username)) return `The username "${username}" is already taken.`;
  return '';
}
async function createFirstAdmin(name, username, p, p2){
  username = normUser(username);
  const err = userProblem(name, username, []) || pwProblem(p, p2); if (err) return S.lockErr = err;
  const acc = { name: name.trim(), username, role: 'admin', createdAt: Date.now(), createdBy: username, ...(await makeSecret(p)) };
  await saveFaculty([acc], `Administrator account created for ${acc.name}.`);
  try { await S.db.doc('staff/auth').delete(); } catch {}   // retire the old single shared password
  startSession(acc); checkUnlock(); logAct('Created administrator account', acc.username);
}
async function login(username, p){
  if (Date.now() < S.lockedUntil) return S.lockErr = `Too many wrong attempts. Try again in ${Math.ceil((S.lockedUntil - Date.now()) / 1000)} seconds.`;
  username = normUser(username);
  if (!username || !p) return S.lockErr = 'Enter your username and password.';
  const acc = (S.faculty || []).find(a => a.username === username);
  const ok = acc && !acc.disabled && (await hashPassword(p, acc.salt, acc.iter || PBKDF2_ITER)) === acc.hash;
  if (ok){ startSession(acc); checkUnlock(); logAct('Logged in'); return; }
  S.fails++;
  if (acc?.disabled && (await hashPassword(p, acc.salt, acc.iter || PBKDF2_ITER)) === acc.hash) return S.lockErr = 'This account is disabled. Ask the administrator to enable it.';
  if (S.fails >= 5){ S.lockedUntil = Date.now() + 30000 * Math.pow(2, S.fails - 5); S.lockErr = 'Too many wrong attempts. Wait 30 seconds and try again.'; }
  else S.lockErr = `Wrong username or password. ${5 - S.fails} attempt${5 - S.fails === 1 ? '' : 's'} left before a short wait.`;
}

/* ---------- learner analytics ----------
   Level is judged on marks earned before proctoring deductions, since deductions measure
   conduct, not learning. "All quizzes" averages each student's percentage across every
   quiz they submitted. */
const LEVELS = [
  { k: 'slow', label: 'Slow learners', color: 'var(--bad)', soft: 'var(--bad-soft)', action: 'Remedial session on the weakest topics, extra practice quizzes, and a follow-up re-test.' },
  { k: 'average', label: 'Average learners', color: 'var(--warn)', soft: 'var(--warn-soft)', action: 'Targeted practice on the weak topics shown below, and peer study with advanced learners.' },
  { k: 'advanced', label: 'Advanced learners', color: 'var(--ok)', soft: 'var(--ok-soft)', action: 'Content beyond the syllabus, harder questions, projects, and peer mentoring of slow learners.' },
];
function learnerData(){
  const { scope, lo, hi } = S.la;
  const quizzes = scope === 'all' ? S.quizzes : S.quizzes.filter(q => q.id === scope);
  const per = new Map();
  for (const q of quizzes){
    const key = S.keys[q.id]?.answers || q.key || {};
    for (const sub of S.subs){
      const a = sub.attempts?.[q.id]; if (!a?.submittedAt) continue;
      const e = per.get(a.roll) || { roll: a.roll, pcts: [], topic: {} };
      let raw = 0;
      for (const x of q.questions){
        const ok = a.answers?.[x.id] === key[x.id], t = x.topic || 'General';
        if (ok) raw += +x.marks || 1;
        e.topic[t] = e.topic[t] || { c: 0, n: 0 }; e.topic[t].n++; if (ok) e.topic[t].c++;
      }
      e.pcts.push(pct(raw, q.totalMarks)); per.set(a.roll, e);
    }
  }
  const rm = new Map(S.roster.map(s => [s.roll, s]));
  const rows = [...per.values()].map(e => {
    const avg = Math.round(e.pcts.reduce((s, x) => s + x, 0) / e.pcts.length * 10) / 10;
    const ts = Object.entries(e.topic).map(([t, v]) => ({ t, acc: v.c / v.n })).sort((a, b) => a.acc - b.acc);
    return { ...e, name: rm.get(e.roll)?.name || '', division: rm.get(e.roll)?.division || '', avg, n: e.pcts.length,
      level: avg < lo ? 'slow' : avg >= hi ? 'advanced' : 'average', weakest: ts[0], strongest: ts[ts.length - 1] };
  }).sort((a, b) => a.avg - b.avg);
  const assigned = scope === 'all' ? S.roster.map(s => s.roll) : (quizzes[0]?.allowedRolls || []);
  const noData = assigned.filter(r => !per.has(r));
  const topics = [...new Set(quizzes.flatMap(q => q.questions.map(x => x.topic || 'General')))].sort();
  const topicAcc = (list, t) => { let c = 0, n = 0; list.forEach(r => { const v = r.topic[t]; if (v){ c += v.c; n += v.n; } }); return n ? c / n : null; };
  return { rows, noData, topics, topicAcc, quizzes };
}
function learnersView(){
  if (!S.quizzes.length) return `<section class="panel"><div class="empty"><h3>No quizzes yet</h3><p>Learner levels appear once students submit quizzes.</p></div></section>`;
  if (S.la.scope !== 'all' && !S.quizzes.some(q => q.id === S.la.scope)) S.la.scope = 'all';
  const d = learnerData(), total = d.rows.length;
  const by = Object.fromEntries(LEVELS.map(L => [L.k, d.rows.filter(r => r.level === L.k)]));
  const share = k => total ? Math.round(by[k].length / total * 100) : 0;
  const accCell = a => a === null ? '<td class="num muted">—</td>' : `<td class="num" style="${a < .4 ? 'color:var(--bad);font-weight:600' : ''}">${Math.round(a * 100)}%</td>`;
  const controls = `<div class="fields" style="max-width:640px">
      <label class="field"><span>Based on</span><select id="la-scope"><option value="all">All quizzes (average)</option>${S.quizzes.map(q => `<option value="${q.id}" ${S.la.scope === q.id ? 'selected' : ''}>${esc(q.title)}</option>`).join('')}</select></label>
      <label class="field"><span>Slow below (%)</span><input type="number" id="la-lo" min="0" max="100" value="${S.la.lo}"></label>
      <label class="field"><span>Advanced from (%)</span><input type="number" id="la-hi" min="0" max="100" value="${S.la.hi}"></label></div>`;
  const head = `<section class="panel"><div class="panel-head"><div><div class="label">Learner analytics · marks before proctoring deductions</div><h2>Slow, average and advanced learners</h2></div>
      <div class="row"><button class="btn" data-act="la-export" ${total ? '' : 'disabled'}>Export CSV</button><button class="btn primary" data-act="save-all">Save all results (Excel)</button></div></div>${controls}`;
  if (!total) return head + `<div class="empty"><h3>No submitted attempts yet</h3><p>Students are grouped here after they submit.</p></div></section>`;
  const dist = `<div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)" role="img" aria-label="${LEVELS.map(L => `${L.label}: ${by[L.k].length}`).join(', ')}">
        ${LEVELS.map(L => by[L.k].length ? `<div style="width:${by[L.k].length / total * 100}%;background:${L.color}" title="${L.label}: ${by[L.k].length}"></div>` : '').join('')}</div>
      <div class="legend">${LEVELS.map(L => `<span><i style="background:${L.color};border-color:${L.color}"></i>${L.label} <b class="mono">${by[L.k].length}</b> (${share(L.k)}%)</span>`).join('')}${d.noData.length ? `<span><i></i>No attempt <b class="mono">${d.noData.length}</b></span>` : ''}</div></div>`;
  const stats = `<div class="stats">${LEVELS.map(L => { const g = by[L.k], avg = g.length ? (g.reduce((s, r) => s + r.avg, 0) / g.length).toFixed(1) + '%' : '—';
      return `<div class="stat" style="border-color:${L.color}"><span class="label" style="color:${L.color}">${L.label}</span><b>${g.length}</b><span class="small muted">${L.k === 'slow' ? `below ${S.la.lo}%` : L.k === 'advanced' ? `${S.la.hi}% and above` : `${S.la.lo}–${S.la.hi}%`} · group average ${avg}</span></div>`; }).join('')}</div>`;
  const groups = LEVELS.map(L => { const g = by[L.k];
    return `<section class="panel" style="border-top:3px solid ${L.color}"><div class="panel-head"><div><div class="label" style="color:${L.color}">${L.label} · ${g.length}</div><h3>${esc(L.action)}</h3></div></div>
      ${g.length ? `<div class="tbl-wrap scroll" style="max-height:320px"><table><thead><tr><th>Roll No</th><th>Name</th><th class="num">Average</th><th class="num">Quizzes</th><th>Weakest topic</th><th>Strongest topic</th></tr></thead><tbody>
        ${(L.k === 'advanced' ? g.slice().reverse() : g).map(r => `<tr><td class="mono">${esc(r.roll)}</td><td>${esc(r.name)}</td><td class="num">${r.avg}%</td><td class="num">${r.n}</td><td>${r.weakest ? `${esc(r.weakest.t)} <span class="small muted">${Math.round(r.weakest.acc * 100)}%</span>` : '—'}</td><td>${r.strongest ? `${esc(r.strongest.t)} <span class="small muted">${Math.round(r.strongest.acc * 100)}%</span>` : '—'}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">No students in this group.</p>'}</section>`; }).join('');
  const topicTable = `<section class="panel"><div><div class="label">Topic accuracy by learner level · red is under 40%</div><h3>Where each group needs help</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Topic</th>${LEVELS.map(L => `<th class="num" style="color:${L.color}">${L.label.split(' ')[0]}</th>`).join('')}<th class="num">Whole class</th></tr></thead><tbody>
      ${d.topics.map(t => `<tr><td>${esc(t)}</td>${LEVELS.map(L => accCell(d.topicAcc(by[L.k], t))).join('')}${accCell(d.topicAcc(d.rows, t))}</tr>`).join('')}
    </tbody></table></div></section>`;
  const rm = new Map(S.roster.map(s => [s.roll, s]));
  const none = d.noData.length ? `<section class="panel"><div><div class="label">Not yet assessed · ${d.noData.length}</div><h3>No submitted attempt${S.la.scope === 'all' ? ' in any quiz' : ' for this quiz'}</h3></div>
    <p class="small">${d.noData.map(r => `<span class="mono">${esc(r)}</span>${rm.get(r)?.name ? ' ' + esc(rm.get(r).name) : ''}`).join(' · ')}</p></section>` : '';
  return head + dist + stats + `</section>` + groups + topicTable + none;
}
/* ---------- save everything for this group as one Excel workbook ---------- */
async function saveAllWorkbook(){
  if (!window.XLSX) return toast('The Excel writer did not load. Use Export CSV on each tab instead.');
  toast('Preparing the workbook…');
  // Read the latest attempts and activity once, so the file is complete whichever tab is open.
  try { const snap = await S.db.collection('subs').get(); S.subs = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch {}
  let activity = [];
  try { const snap = await S.db.collection('staff/log/entries').orderBy('at', 'desc').limit(1000).get(); activity = snap.docs.map(d => d.data()); } catch {}
  const now = new Date(), stamp = now.toISOString().slice(0, 10);
  const rm = new Map(S.roster.map(s => [s.roll, s]));
  const when = t => t ? new Date(t).toLocaleString() : '';
  const wb = XLSX.utils.book_new(), used = new Set();
  const add = (name, rows, widths) => {
    let n = name.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim() || 'Sheet', base = n, i = 2;
    while (used.has(n.toLowerCase())) n = base.slice(0, 28) + ' ' + i++;
    used.add(n.toLowerCase());
    const ws = XLSX.utils.aoa_to_sheet(rows);
    if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, n);
  };
  const quizzes = S.quizzes.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const R = new Map(quizzes.map(q => [q.id, results(q)]));

  // 1. Summary

      done.filter(r => r.pct >= 40).length, rows.reduce((s, r) => s + r.tabs, 0), rows.filter(r => r.viol).length, q.released ? 'Yes' : 'No']);

  // 2. One results sheet per quiz
  quizzes.forEach((q, qi) => {

    missing.forEach(roll => out.push(['', roll, rm.get(roll)?.name || '', rm.get(roll)?.division || '', '', q.totalMarks, '', '', '', '', '', '', '', '', 'Not started', '', '', '']));
    add(`${qi + 1} ${q.title}`, out, [6, 14, 22, 9, 10, 7, 8, 12, 10, 8, 9, 11, 11, 10, 14, 10, 20, 24]);
  });

  // 3. Question analysis (full statements)
  const qa = [['Quiz', 'Q#', 'Question', 'Topic', 'Marks', 'Correct option', 'Correct answer', 'Students answered', '% correct']];
  quizzes.forEach(q => {
    const { rows, perQ, key } = R.get(q.id), done = rows.filter(r => r.submitted);
    perQ.forEach((p, i) => qa.push([q.title, i + 1, p.q.text, p.q.topic || 'General', p.q.marks, LETTERS[key[p.q.id]] || '', p.q.options[key[p.q.id]] ?? '',
      done.filter(r => r.answers[p.q.id] !== undefined).length, done.length ? Math.round(p.rate * 100) : '']));
  });
  add('Question analysis', qa, [28, 5, 70, 18, 7, 9, 30, 10, 10]);

  // 4. Learner levels across all quizzes, and 5. topic accuracy by level
  const keepScope = S.la.scope; S.la.scope = 'all';
  const d = learnerData(); S.la.scope = keepScope;
  const lvlName = { slow: 'Slow', average: 'Average', advanced: 'Advanced' };
  const ll = [[`Learner levels · average across all quizzes · slow below ${S.la.lo}%, advanced from ${S.la.hi}% · marks before proctoring deductions`], [],
    ['Roll No', 'Name', 'Division', 'Learner level', 'Average %', 'Quizzes submitted', 'Weakest topic', 'Weakest %', 'Strongest topic', 'Strongest %', 'Suggested action']];
  d.rows.forEach(r => ll.push([r.roll, r.name, r.division, lvlName[r.level], r.avg, r.n, r.weakest?.t || '', r.weakest ? Math.round(r.weakest.acc * 100) : '', r.strongest?.t || '', r.strongest ? Math.round(r.strongest.acc * 100) : '', LEVELS.find(L => L.k === r.level).action]));
  d.noData.forEach(r => ll.push([r, rm.get(r)?.name || '', rm.get(r)?.division || '', 'Not assessed', '', 0, '', '', '', '', '']));
  ll.push([], ['Totals', ...LEVELS.map(L => `${lvlName[L.k]}: ${d.rows.filter(r => r.level === L.k).length}`), `Not assessed: ${d.noData.length}`]);

  const byLvl = Object.fromEntries(LEVELS.map(L => [L.k, d.rows.filter(r => r.level === L.k)]));
  const pctOrBlank = a => a === null ? '' : Math.round(a * 100);
  const tb = [['Topic accuracy (%) by learner level'], [], ['Topic', 'Slow', 'Average', 'Advanced', 'Whole class']];
  d.topics.forEach(t => tb.push([t, ...LEVELS.map(L => pctOrBlank(d.topicAcc(byLvl[L.k], t))), pctOrBlank(d.topicAcc(d.rows, t))]));
  add('Topic by level', tb, [26, 9, 9, 10, 12]);

  // 6. Every proctoring violation
  const vio = [['Quiz', 'Roll No', 'Name', 'Time', 'Violation', 'Seconds away']];
  quizzes.forEach(q => R.get(q.id).rows.forEach(r => r.violations.forEach(v => vio.push([q.title, r.roll, r.name, when(v.at), VIOL_LABEL[v.t] || v.t, v.secs || '']))));
  add('Violations', vio, [28, 14, 22, 20, 30, 12]);

  // 7. Student list and 8. activity log
  add('Students', [['Roll No', 'Name', 'Email', 'Division'], ...S.roster.map(s => [s.roll, s.name, s.email, s.division])], [14, 24, 30, 9]);
  add('Activity', [['When', 'Faculty', 'Username', 'Action', 'Details'], ...activity.map(e => [when(e.at), e.name || '', e.user || '', e.action, e.detail || ''])], [20, 22, 14, 24, 60]);

  const filename = `${GROUP.name.replace(/\s+/g, '-')}-all-results-${stamp}.xlsx`;
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  logAct('Saved all results', `${quizzes.length} quizzes, ${filename}`);
  if (S.downloads){
    try { await S.downloads.save({ filename, data: new Uint8Array(data) }); toast(`Saved ${filename}.`); return; }
    catch (e){ if (e?.code === 'declined') return toast('Save cancelled.'); }
  }
  try { XLSX.writeFile(wb, filename); toast(`Saved ${filename}.`); } catch { toast('Couldn\'t save the file from this view.'); }
}

  const rm = new Map(S.roster.map(s => [s.roll, s]));

function buildOrder(q){
  const rand = rng(hashStr((S.uid || '') + q.id));
  const ids = q.questions.map(x => x.id);
  const order = q.shuffle ? shuffled(ids, rand) : ids;
  const opt = {};
  q.questions.forEach(x => { const idx = x.options.map((_, i) => i); opt[x.id] = q.shuffle ? shuffled(idx, rand) : idx; });
  return { order, opt };
}
/* Answers are kept on the device at once and synced to the shared database every 15–20 s
   (a random offset per student, so 80 students don't all save at the same moment).
   Start, submit, violations that end the quiz, and leaving the tab sync immediately. */
const SYNC_MS = 15000 + Math.floor(Math.random() * 5000);
let saveChain = Promise.resolve(), pendingSync = false, lastSync = 0, syncWarned = false;
function touch(){
  const a = S.take && S.mySub?.attempts?.[S.take.id];
  if (a){ a.updatedAt = Date.now(); store('qd.att.' + S.take.id, JSON.stringify(a)); }
  pendingSync = true;
}
function flush(){
  if (!S.mySub) return saveChain;
  pendingSync = false; lastSync = Date.now();
  const body = clone(S.mySub);
  saveChain = saveChain.then(() => S.db.doc('subs/' + S.uid).set(body)).then(() => { syncWarned = false; }).catch(() => {
    pendingSync = true;
    if (!syncWarned){ syncWarned = true; toast('Answers are saved on this device and will sync when the connection returns.'); }
  });
  return saveChain;
}
function saveSub(now){ touch(); if (now) return flush(); }
setInterval(() => { if (pendingSync && Date.now() - lastSync >= SYNC_MS) flush(); }, 1000);

async function startQuiz(id){
  const meta = S.index.find(x => x.id === id); if (!meta) return;
  if (!meta.allowedRolls.includes(S.roll)) return toast(`Roll number ${S.roll} isn't on the list for this quiz. Check with your teacher.`);
  // One read of the questions per student, at start; then nothing more until submit.
  if (!S.full[id]){
    try { const d = await S.db.doc('quizzes/' + id).get(); if (!d.exists) return toast('This quiz is no longer available.'); S.full[id] = { id, ...d.data() }; }
    catch { return toast('Couldn\'t load the quiz. Check your connection and press Start again.'); }
  }
  const q = S.full[id];
  // Re-read the record first so a fresh start never overwrites earlier attempts.
  if (!(await loadMySub()) && !S.mySubLoaded) return toast('Couldn\'t load your record. Check your connection and press Start again.');
  S.mySub = S.mySub ? clone(S.mySub) : { attempts: {} };
  S.mySub.roll = S.roll; S.mySub.attempts = S.mySub.attempts || {};
  if (!S.mySub.attempts[id]) { S.mySub.attempts[id] = { roll: S.roll, startedAt: Date.now(), answers: {}, marked: {} }; await saveSub(true); }
  else {
    // Resume: prefer this device's backup if it has newer answers than the last sync.
    try { const loc = JSON.parse(store('qd.att.' + id) || 'null'); const srv = S.mySub.attempts[id];
      if (loc && !srv.submittedAt && loc.startedAt === srv.startedAt && (loc.updatedAt || 0) > (srv.updatedAt || 0)){ S.mySub.attempts[id] = loc; pendingSync = true; } } catch {}
  }
  const a = S.mySub.attempts[id];
  S.take = { id, ...buildOrder(q), cur: 0, confirm: false, deadline: a.startedAt + q.durationMin * 60000 };
  store('qd.roll', S.roll);
  if (Date.now() >= S.take.deadline) return submitQuiz(true);
  startTimer(); render();
}
let timerI;
function startTimer(){ clearInterval(timerI); timerI = setInterval(tick, 1000); tick(); }
function tick(){
  if (!S.take) return clearInterval(timerI);
  const left = S.take.deadline - Date.now(), el = $('#timer');
  if (el){ el.textContent = fmtTime(left); el.classList.toggle('low', left < 60000); }
  if (left <= 0) submitQuiz(true);
}
function checkClosed(){
  if (!S.indexLoaded) return false;
  const q = S.index.find(x => x.id === S.take.id);
  if (!q || q.status !== 'live'){ submitQuiz(true, 'Your teacher closed this quiz, so your answers were submitted.'); return true; }
  return false;
}
async function submitQuiz(auto, msg){
  if (!S.take) return;
  const id = S.take.id; clearInterval(timerI);
  const a = S.mySub.attempts[id];
  if (!a.submittedAt){ a.submittedAt = Math.min(Date.now(), S.take.deadline); a.auto = !!auto; }
  S.take = null;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  await saveSub(true);
  toast(msg || (auto ? 'Time is up. Your answers were submitted.' : 'Submitted. Your answers are recorded.'));
  render();
}

        <p class="qtext">${esc(item.text)}</p>
        <div class="choices" role="group" aria-label="Options">${t.opt[qid].map((orig, i) => `<button class="choice" data-act="pick" data-v="${orig}" aria-pressed="${a.answers[qid] === orig}"><span class="bub">${LETTERS[i]}</span><span>${esc(item.options[orig])}</span></button>`).join('')}</div>
        <div class="row" style="justify-content:space-between">
          <div class="row"><button class="btn" data-act="prev" ${t.cur ? '' : 'disabled'}>Previous</button><button class="btn" data-act="next" ${t.cur < t.order.length - 1 ? '' : 'disabled'}>Next</button></div>
          <div class="row"><button class="btn ghost sm" data-act="mark">${a.marked?.[qid] ? 'Unmark review' : 'Mark for review'}</button>${a.answers[qid] !== undefined ? '<button class="btn ghost sm" data-act="clear">Clear answer</button>' : ''}</div>

        <div class="palette">${t.order.map((id, i) => `<button class="pal ${a.answers[id] !== undefined ? 'ans' : ''} ${i === t.cur ? 'cur' : ''} ${a.marked?.[id] ? 'mark' : ''}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div>

        ${t.confirm ? `<div class="confirm"><b>Submit now?</b><p class="small">${unanswered ? `${unanswered} question${unanswered === 1 ? ' is' : 's are'} unanswered.` : 'All questions answered.'} You can't change answers after submitting.</p>
          <div class="row"><button class="btn primary" data-act="submit-yes">Submit</button><button class="btn ghost" data-act="submit-no">Keep working</button></div></div>`
          : `<button class="btn primary" data-act="submit-ask">Submit quiz</button>`}
      </aside></div>`;
}
function reviewView(q){
  if (!q || !q.released){ S.reviewQuiz = null; return studentView(); }
  const a = S.mySub?.attempts?.[q.id] || { answers: {} }, key = q.key || {};
  let score = 0, correct = 0;
  q.questions.forEach(x => { if (a.answers[x.id] === key[x.id]){ score += +x.marks || 1; correct++; } });
  const pen = penaltyOf(q, a), raw = score;
  score = Math.max(0, raw - pen.ded);
  return `<section class="panel"><div class="panel-head"><div><div class="label">Result · <span class="mono">${esc(a.roll || S.roll)}</span></div><h2>${esc(q.title)}</h2></div><button class="btn sm" data-act="back">All quizzes</button></div>
    <div class="row" style="gap:24px;align-items:flex-end"><div><div class="scorebig">${score}<span class="muted" style="font-size:1.4rem"> / ${q.totalMarks}</span></div><div class="muted">${pct(score, q.totalMarks)}% · ${correct} of ${q.questions.length} correct</div>
      ${pen.v ? `<div class="small" style="color:var(--bad)">${raw} marks earned − ${pen.ded} for ${pen.v} proctoring violation${pen.v === 1 ? '' : 's'}${pen.ded ? '' : ' (within free warnings)'}</div>` : ''}</div>
      <div class="small muted">Submitted ${fmtDate(a.submittedAt)}${a.submittedAt && a.startedAt ? ' · took ' + fmtTime(a.submittedAt - a.startedAt) : ''}</div></div></section>
    <section class="panel"><h3>Answer review</h3><div class="review">${q.questions.map((x, i) => { const mine = a.answers[x.id], ok = mine === key[x.id];
      return `<article class="qcard ${ok ? 'right' : 'wrong'}"><p class="qtxt"><b class="mono muted">${i + 1}.</b> ${esc(x.text)}</p>
        <div class="opts">${x.options.map((o, j) => { const isKey = j === key[x.id], isMine = j === mine; return `<div class="${isKey ? 'right' : ''}"><span class="bub sm ${isKey ? 'ok fill' : isMine ? 'no fill' : ''}">${LETTERS[j]}</span><span>${esc(o)}${isMine ? ' <span class="small muted">(your answer)</span>' : ''}</span></div>`; }).join('')}</div>
        <div class="qmeta"><span>${ok ? `+${x.marks}` : mine === undefined ? 'Not answered' : '0'}</span><span>${esc(x.topic)}</span></div></article>`; }).join('')}</div></section>`;
}

/* ---------- events ---------- */
function bind(){
  ['students', 'bank'].forEach(kind => {
    const inp = $('#file-' + kind); if (!inp) return;
    inp.onchange = () => inp.files[0] && handleUpload(kind, inp.files[0]);
    const dz = document.querySelector(`[data-drop="${kind}"]`);
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handleUpload(kind, f); };
  });
  document.querySelectorAll('input[name^="mode-"]').forEach(r => r.onchange = () => { S.pending.mode = r.value; });
  const on = (id, ev, fn) => { const el = $('#' + id); if (el) el['on' + ev] = fn; };
  on('roster-q', 'input', e => { S.rosterFilter = e.target.value; renderKeepFocus('roster-q'); });
  on('bank-q', 'input', e => { S.bankFilter.q = e.target.value; renderKeepFocus('bank-q'); });
  on('bank-topic', 'change', e => { S.bankFilter.topic = e.target.value; render(); });
  on('bank-diff', 'change', e => { S.bankFilter.diff = e.target.value; render(); });
  on('b-title', 'input', e => S.builder.title = e.target.value);
  on('b-count', 'input', e => { S.builder.count = e.target.value; });
  on('b-count', 'change', () => render());
  on('b-duration', 'input', e => S.builder.duration = e.target.value);
  on('b-diff', 'change', e => { S.builder.diff = e.target.value; render(); });
  on('b-shuffle', 'change', e => S.builder.shuffle = e.target.checked);
  on('b-penalty', 'input', e => S.builder.penalty = e.target.value);
  on('b-free', 'input', e => S.builder.free = e.target.value);
  on('b-maxv', 'input', e => S.builder.maxV = e.target.value);
  document.querySelectorAll('[data-topic]').forEach(c => c.onchange = () => { const t = c.dataset.topic; S.builder.topics = c.checked ? [...S.builder.topics, t] : S.builder.topics.filter(x => x !== t); render(); });
  document.querySelectorAll('[data-div]').forEach(c => c.onchange = () => { const d = c.dataset.div; S.builder.divisions = c.checked ? [...S.builder.divisions, d] : S.builder.divisions.filter(x => x !== d); render(); });
  on('r-quiz', 'change', e => { S.resultsQuiz = e.target.value; render(); });
  on('la-scope', 'change', e => { S.la.scope = e.target.value; render(); });
  on('la-lo', 'change', e => { S.la.lo = Math.min(Math.max(0, +e.target.value || 0), S.la.hi); render(); });
  on('la-hi', 'change', e => { S.la.hi = Math.max(Math.min(100, +e.target.value || 0), S.la.lo); render(); });
  on('s-roll', 'keydown', e => { if (e.key === 'Enter') act('set-roll'); });
  on('li-pass', 'keydown', e => { if (e.key === 'Enter') act('fac-login', $('[data-act="fac-login"]')); });
  on('ac-pass2', 'keydown', e => { if (e.key === 'Enter') act('fac-setup', $('[data-act="fac-setup"]')); });
  on('act-who', 'change', e => { S.activityWho = e.target.value; render(); });
  if (S.view === 'teacher' && !S.unlocked && !document.activeElement?.matches?.('input')) ($('#li-user') || $('#ac-name'))?.focus();
}
function renderKeepFocus(id){ const el = $('#' + id), pos = el.selectionStart; render(); const n = $('#' + id); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }

async function act(a, el){
  const id = el?.dataset.id;
  switch (a){
    case 'as-student': S.view = 'student'; store('qd.view', 'student'); render(); break;
    case 'as-teacher': S.view = 'teacher'; store('qd.view', 'teacher'); render(); break;
    case 'lock': await logAct('Logged out'); sess(SESS_KEY, null); S.pwPanel = false; S.pending = null; S.activity = null; render(); toast('Logged out.'); break;
    case 'pw-panel': S.pwPanel = !S.pwPanel; S.lockErr = ''; S.resetFor = null; render(); break;
    case 'fac-setup': el.disabled = true;
      try { await createFirstAdmin($('#ac-name').value, $('#ac-user').value, $('#ac-pass').value, $('#ac-pass2').value); } catch {} render(); break;
    case 'fac-login': el.disabled = true; await login($('#li-user').value, $('#li-pass').value); render(); break;
    case 'fac-reset-ask': S.confirmReset = true; render(); break;
    case 'fac-reset-no': S.confirmReset = false; render(); break;
    case 'fac-reset': await write(() => S.db.doc('staff/faculty').delete(), 'All faculty accounts removed. Create a new administrator account.'); S.faculty = []; S.confirmReset = false; S.lockErr = ''; render(); break;
    case 'my-pass': { el.disabled = true;
      const cur = $('#my-cur').value, me = S.me;
      if (!cur || (await hashPassword(cur, me.salt, me.iter || PBKDF2_ITER)) !== me.hash){ S.lockErr = 'Current password is wrong.'; render(); break; }
      const e2 = pwProblem($('#my-new').value, $('#my-new2').value); if (e2){ S.lockErr = e2; render(); break; }
      const sec = await makeSecret($('#my-new').value);
      try { await saveFaculty(S.faculty.map(a => a.username === me.username ? { ...a, ...sec } : a), 'Your password is changed.'); startSession({ ...me, ...sec }); logAct('Changed own password'); S.lockErr = ''; } catch {}
      render(); break; }
    case 'ac-add': { el.disabled = true;
      const name = $('#nf-name').value, user = normUser($('#nf-user').value), pass = $('#nf-pass').value, role = $('#nf-role').value;
      const e2 = userProblem(name, user, S.faculty) || (pass.length < 8 ? 'Use at least 8 characters for the temporary password.' : '');
      if (e2){ S.lockErr = e2; render(); break; }
      const acc = { name: name.trim(), username: user, role, createdAt: Date.now(), createdBy: S.me.username, ...(await makeSecret(pass)) };
      try { await saveFaculty([...S.faculty, acc], `Added ${acc.name} (${user}).`); logAct('Added faculty account', `${acc.name} (${user}), ${role === 'admin' ? 'administrator' : 'faculty'}`); S.lockErr = ''; } catch {}
      render(); break; }
    case 'ac-resetpw': S.resetFor = id; S.lockErr = ''; render(); $('#ac-temp')?.focus(); break;
    case 'ac-temp-cancel': S.resetFor = null; render(); break;
    case 'ac-temp-save': { const pass = $('#ac-temp').value;
      if (pass.length < 8){ S.lockErr = 'Use at least 8 characters for the temporary password.'; render(); break; }
      const sec = await makeSecret(pass);
      try { await saveFaculty(S.faculty.map(a => a.username === id ? { ...a, ...sec } : a), `Password reset for ${id}. Their open sessions are logged out.`); logAct('Reset password', id); S.resetFor = null; S.lockErr = ''; } catch {}
      render(); break; }
    case 'ac-toggle': { const t = S.faculty.find(a => a.username === id); if (!t) break;
      try { await saveFaculty(S.faculty.map(a => a.username === id ? { ...a, disabled: !a.disabled } : a), `${t.name} is ${t.disabled ? 'enabled' : 'disabled'}.`); logAct(t.disabled ? 'Enabled account' : 'Disabled account', id); } catch {}
      render(); break; }
    case 'ac-remove-ask': S.confirmDelete = 'acct:' + id; render(); break;
    case 'ac-remove': { const t = S.faculty.find(a => a.username === id);
      try { await saveFaculty(S.faculty.filter(a => a.username !== id), `Removed ${t?.name || id}.`); logAct('Removed account', id); } catch {}
      S.confirmDelete = null; render(); break; }
    case 'act-refresh': S.activity = null; render(); break;
    case 'cancel-pending': S.pending = null; render(); break;
    case 'save-pending': el.disabled = true; try { await savePending(); } catch { el.disabled = false; } break;
    case 'read-paste': { const t = $('#paste-' + el.dataset.kind).value; if (!t.trim()) return toast('Paste rows first, with the header row on top.'); handleUpload(el.dataset.kind, t); break; }
    case 'sample': loadSample(el.dataset.kind); break;
    case 'rm-student': removeStudent(id); break;
    case 'rm-q': removeQuestion(id); break;
    case 'create-quiz': el.disabled = true; try { await createQuiz(); } finally { el.disabled = false; } break;
    case 'q-live': { const q = S.quizzes.find(x => x.id === id);
      await setQuiz(id, { status: 'live', startedBy: S.me.username, startedByName: S.me.name, startedAt: Date.now() }, 'Quiz is live. Students on its list can start now.');
      logAct(q?.status === 'closed' ? 'Reopened quiz' : 'Started quiz', q?.title); break; }
    case 'q-close': { const q = S.quizzes.find(x => x.id === id);
      await setQuiz(id, { status: 'closed', closedBy: S.me.username, closedByName: S.me.name, closedAt: Date.now() }, 'Quiz closed. Anyone still answering is submitted automatically.');
      logAct('Closed quiz', q?.title); break; }
    case 'q-release': { const q = S.quizzes.find(x => x.id === id);
      await releaseResults(id, !q?.released); logAct(q?.released ? 'Hid results' : 'Released results', q?.title); break; }
    case 'q-results': S.resultsQuiz = id; S.tab = 'results'; store('qd.tab', 'results'); render(); break;
    case 'q-delete-ask': S.confirmDelete = id; render(); break;
    case 'q-delete-cancel': S.confirmDelete = null; render(); break;
    case 'q-delete': { const t = S.quizzes.find(x => x.id === id)?.title; await deleteQuiz(id); logAct('Deleted quiz', t); break; }
    case 'copy-link': {   // clipboard write must happen inside the click
      const v = el.dataset.v, box = $('#' + el.dataset.box);
      navigator.clipboard.writeText(v).then(() => toast(el.dataset.box === 'stu-link' ? 'Student link copied. Send it to this group only.' : 'Faculty link copied.'))
        .catch(() => { box?.focus(); box?.select(); toast('Press Ctrl+C (Cmd+C on Mac) to copy the selected link.'); });
      break; }
    case 'save-all': el.disabled = true; try { await saveAllWorkbook(); } finally { el.disabled = false; } break;
    case 'la-export': exportLearners(); logAct('Exported learner levels'); break;
    case 'export': { const q = S.quizzes.find(x => x.id === S.resultsQuiz); exportCSV(q); logAct('Exported results', q?.title); break; }
    case 'set-roll': { const v = ($('#s-roll')?.value || '').trim().toUpperCase(); if (!v) return toast('Enter your roll number.');
      const known = S.index.some(q => q.allowedRolls.includes(v)); const anyLive = S.index.some(q => q.status === 'live');
      if (anyLive && !known) toast(`${v} isn't on any quiz list yet. Check it matches your class list.`);
      S.roll = v; store('qd.roll', v); render(); break; }
    case 'change-roll': S.roll = ''; store('qd.roll', ''); render(); break;
    case 'start': S.preStart = id; render(); break;
    case 'pre-cancel': S.preStart = null; render(); break;
    case 'start-go': S.preStart = null; enterFullscreen(); startQuiz(id); break;
    case 'warn-ok': if (S.take){ S.take.warn = null; enterFullscreen(); render(); } break;
    case 'review': {   // one read, only when the student asks for their result
      try { const d = await S.db.doc('quizzes/' + id).get(); if (d.exists) S.full[id] = { id, ...d.data() }; } catch { return toast('Couldn\'t load the result. Try again.'); }
      S.reviewQuiz = id; render(); break; }
    case 'back': S.reviewQuiz = null; render(); break;
    case 'pick': case 'clear': case 'mark': {
      const t = S.take, at = S.mySub.attempts[t.id], qid = t.order[t.cur];
      if (a === 'pick') at.answers[qid] = +el.dataset.v;
      if (a === 'clear') delete at.answers[qid];
      if (a === 'mark'){ at.marked = at.marked || {}; at.marked[qid] = !at.marked[qid]; }
      saveSub(); render(); break; }
    case 'prev': S.take.cur = Math.max(0, S.take.cur - 1); render(); break;
    case 'next': S.take.cur = Math.min(S.take.order.length - 1, S.take.cur + 1); render(); break;
    case 'goto': S.take.cur = +el.dataset.i; render(); break;
    case 'submit-ask': S.take.confirm = true; render(); break;
    case 'submit-no': S.take.confirm = false; render(); break;
    case 'submit-yes': submitQuiz(false); break;
  }
}
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ S.tab = tab.dataset.tab; store('qd.tab', S.tab); S.pending = null; render(); return; }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b);
});
document.addEventListener('keydown', e => {
  if (!S.take || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const t = S.take, q = S.full[t.id], qid = t.order[t.cur];
  const k = e.key.toUpperCase(), i = LETTERS.indexOf(k);
  const n = q.questions.find(x => x.id === qid).options.length;
  if (i >= 0 && i < n){ S.mySub.attempts[t.id].answers[qid] = t.opt[qid][i]; saveSub(); render(); }
  else if (e.key === 'ArrowRight' && t.cur < t.order.length - 1){ t.cur++; render(); }
  else if (e.key === 'ArrowLeft' && t.cur > 0){ t.cur--; render(); }
});
window.addEventListener('beforeunload', () => { if (S.take && pendingSync) flush(); });
window.addEventListener('pagehide', () => { if (S.take && pendingSync) flush(); });

/* ---------- proctoring engine (active only while an exam is open) ---------- */
const lastViol = {};
function violation(type, extra){
  if (!S.take) return;
  const now = Date.now();
  if (now - (lastViol[type] || 0) < 3000) return;   // one event per burst, e.g. Ctrl+C held down
  lastViol[type] = now;
  const q = S.full[S.take.id], a = S.mySub.attempts[S.take.id];
  a.violations = a.violations || [];
  a.violations.push({ t: type, at: now, ...(extra || {}) });
  S.take.warn = { type };
  const { v, p } = penaltyOf(q, a);
  if (p.maxV && v >= p.maxV) return submitQuiz(true, `Submitted automatically after ${v} proctoring violations.`);
  touch(); render();   // synced on the next interval, or at once if the student leaves the tab
}
let awayAt = 0, awayHidden = false;
function goneAway(hidden){ if (!S.take) return; if (!awayAt) awayAt = Date.now(); if (hidden){ awayHidden = true; if (pendingSync) flush(); } }
function cameBack(){
  if (!S.take || !awayAt) return;
  const ms = Date.now() - awayAt, hidden = awayHidden;
  awayAt = 0; awayHidden = false;
  if (hidden || ms > 1500) violation('tab', { secs: Math.round(ms / 1000) });
}
document.addEventListener('visibilitychange', () => document.hidden ? goneAway(true) : cameBack());
window.addEventListener('blur', () => goneAway(false));
window.addEventListener('focus', cameBack);
[['copy', 'copy'], ['cut', 'cut'], ['paste', 'paste'], ['contextmenu', 'menu'], ['drop', 'drop']].forEach(([ev, type]) =>
  document.addEventListener(ev, e => { if (!S.take) return; e.preventDefault(); violation(type); }, true));
['dragover', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (S.take) e.preventDefault(); }, true));
document.addEventListener('keyup', e => { if (S.take && e.key === 'PrintScreen') violation('screenshot'); });
function enterFullscreen(){
  const el = document.documentElement;
  try { const p = el.requestFullscreen?.(); if (p) p.then(() => { if (S.take) S.take.fs = true; }).catch(() => {}); } catch {}
}
document.addEventListener('fullscreenchange', () => {
  if (!S.take) return;
  if (document.fullscreenElement) S.take.fs = true;
  else if (S.take.fs){ S.take.fs = false; violation('fullscreen'); }
});

boot();
</script>
