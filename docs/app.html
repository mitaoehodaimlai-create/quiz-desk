<body>
<header class="bar"><div class="bar-in">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><i class="f"></i><i></i><i></i><i></i><i class="f"></i><i></i></span>Quiz Desk <span class="role" id="groupChip" style="font-family:var(--body)" hidden></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="bar-end" id="barEnd"></div>
</div></header>
<main id="view"><div class="empty"><h3>Opening Quiz Desk…</h3></div></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ======================================================================
   Quiz Desk on Vercel + Supabase. One page serves three links per group:
     /s/<group>  students: roll number + PIN, then the quiz
     /f/<group>  faculty: students, shared question bank, quizzes, results
     /r/<group>  faculty: results and analytics only
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const clone = o => JSON.parse(JSON.stringify(o));
const LETTERS = ['A','B','C','D','E','F'];
const ms = t => t ? new Date(t).getTime() : null;
const fmtTime = m => { const s = Math.max(0, Math.round(m / 1000)); const h = Math.floor(s / 3600), mi = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(mi).padStart(2, '0') : mi) + ':' + String(x).padStart(2, '0'); };
const fmtDate = t => t ? new Date(t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { return null; } }
function sstore(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { return null; } }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, rand){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const errMsg = e => e?.hint || e?.message || String(e || 'Something went wrong.');

/* ---------- route ---------- */
function parseRoute(){
  const m = /^\/(s|f|r)(?:\/([A-Za-z0-9]{1,12}))?\/?$/.exec(location.pathname) || /^#\/?(s|f|r)(?:\/([A-Za-z0-9]{1,12}))?$/.exec(location.hash);
  return m ? { mode: m[1], group: (m[2] || '').toUpperCase() } : { mode: 'home', group: '' };
}
const ROUTE = parseRoute();
const linkFor = (mode, g) => `${location.origin}/${mode}/${g}`;

/* ---------- Supabase ---------- */
const CFG = window.QD_CONFIG || {};
const sb = (window.supabase && CFG.supabaseUrl) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, storageKey: 'qd-faculty', detectSessionInUrl: true, flowType: 'implicit' } }) : null;
async function rpc(name, args){ const { data, error } = await sb.rpc(name, args); if (error) throw error; return data; }
async function q(promise){ const { data, error } = await promise; if (error) throw error; return data; }

/* ---------- shared: upload parsing ---------- */
function parseCSV(text){
  const lines = text.replace(/\r\n?/g, '\n'), first = lines.split('\n')[0] || '';
  const delim = (first.split('\t').length > first.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], cell = '', inq = false;
  for (let i = 0; i < lines.length; i++){
    const c = lines[i];
    if (inq){ if (c === '"'){ if (lines[i + 1] === '"'){ cell += '"'; i++; } else inq = false; } else cell += c; }
    else if (c === '"') inq = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
async function fileRows(file){
  if (window.XLSX){
    const wb = XLSX.read(await file.arrayBuffer());
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false }).filter(r => r.some(x => String(x).trim()));
  }
  if (/\.(csv|txt|tsv)$/i.test(file.name)) return parseCSV(await file.text());
  throw new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead.');
}
const findCol = (heads, aliases) => heads.findIndex(h => aliases.includes(h));
const STUDENT_COLS = {
  roll: ['roll','rollno','rollnumber','prn','prnno','prnnumber','enrollment','enrollmentno','enrolmentno','studentid','regno','registrationno','usn','id'],
  name: ['name','studentname','fullname','student','nameofstudent'],
  email: ['email','emailid','mail','emailaddress','mailid'],
  division: ['division','div','batch','class','section','branch','group'],
};
function parseStudents(rows){
  const heads = (rows[0] || []).map(norm), issues = [];
  const ix = Object.fromEntries(Object.entries(STUDENT_COLS).map(([k, a]) => [k, findCol(heads, a)]));
  if (ix.roll < 0) return { error: 'No roll number column found. Name the header "Roll No" or "PRN".' };
  if (ix.name < 0) issues.push('No name column found; students will be listed by roll number only.');
  const out = [], seen = new Set();
  rows.slice(1).forEach((r, i) => {
    const roll = String(r[ix.roll] ?? '').trim().toUpperCase();
    if (!roll){ issues.push(`Row ${i + 2}: missing roll number, skipped.`); return; }
    if (seen.has(roll)){ issues.push(`Row ${i + 2}: roll ${roll} repeats an earlier row, skipped.`); return; }
    seen.add(roll);
    out.push({ roll, name: ix.name >= 0 ? String(r[ix.name]).trim() : '', email: ix.email >= 0 ? String(r[ix.email]).trim() : '', division: ix.division >= 0 ? String(r[ix.division]).trim().toUpperCase() : '' });
  });
  return { rows: out, issues };
}
const Q_COLS = {
  text: ['question','questiontext','q','text','stem','questions'],
  answer: ['answer','correct','correctanswer','key','ans','correctoption','answerkey','rightanswer'],
  topic: ['topic','unit','chapter','module','subject','co','courseoutcome'],
  diff: ['difficulty','level','difficultylevel','diff'],
  marks: ['marks','mark','points','score','weight','weightage'],
};
const OPT_COLS = LETTERS.map((L, i) => { const l = L.toLowerCase(), n = i + 1; return [l, 'option' + l, 'opt' + l, 'choice' + l, 'option' + n, 'opt' + n, 'choice' + n, 'o' + n]; });
function normDiff(v){ const s = norm(v); if (!s) return 'medium'; if (/^(e|1|low)/.test(s)) return 'easy'; if (/^(h|3|high|diff)/.test(s)) return 'hard'; return 'medium'; }
function parseQuestions(rows){
  const heads = (rows[0] || []).map(norm), issues = [];
  const ix = Object.fromEntries(Object.entries(Q_COLS).map(([k, a]) => [k, findCol(heads, a)]));
  const optIx = OPT_COLS.map(a => findCol(heads, a)).filter(i => i >= 0);
  if (ix.text < 0) return { error: 'No question column found. Name the header "Question".' };
  if (optIx.length < 2) return { error: 'Need at least two option columns, named A, B, C, D (or Option A … Option D).' };
  if (ix.answer < 0) return { error: 'No answer column found. Name the header "Answer" and put A–D (or the option text) in it.' };
  const out = [];
  rows.slice(1).forEach((r, i) => {
    const text = String(r[ix.text] ?? '').trim();
    if (!text){ issues.push(`Row ${i + 2}: empty question, skipped.`); return; }
    const options = optIx.map(j => String(r[j] ?? '').trim()).filter(Boolean);
    if (options.length < 2){ issues.push(`Row ${i + 2}: fewer than two options, skipped.`); return; }
    const raw = String(r[ix.answer] ?? '').trim();
    let answer;
    if (/^(option\s*)?[a-f]$/i.test(raw)) answer = LETTERS.indexOf(raw.slice(-1).toUpperCase());
    else if (/^\d$/.test(raw)) answer = +raw - 1;
    else answer = options.findIndex(o => norm(o) === norm(raw));
    if (answer < 0 || answer >= options.length){ issues.push(`Row ${i + 2}: answer "${raw || 'blank'}" doesn't match an option, skipped.`); return; }
    const marks = ix.marks >= 0 ? parseFloat(r[ix.marks]) : NaN;
    out.push({ text, options, answer, topic: ix.topic >= 0 ? String(r[ix.topic]).trim() || 'General' : 'General', difficulty: ix.diff >= 0 ? normDiff(r[ix.diff]) : 'medium', marks: marks > 0 ? marks : 1 });
  });
  return { rows: out, issues };
}

/* ---------- shared: proctoring rules ---------- */
const PROCTOR_DEFAULT = { penalty: 1, free: 1, maxV: 5 };
const VIOL_LABEL = { tab: 'Left the quiz tab or window', copy: 'Tried to copy text', cut: 'Tried to cut text', paste: 'Tried to paste text', menu: 'Opened the right-click menu', drop: 'Dragged in content from elsewhere', fullscreen: 'Left full screen', screenshot: 'Pressed Print Screen' };
const proctorOf = quiz => ({ ...PROCTOR_DEFAULT, ...(quiz.proctor || {}) });
function penaltyOf(quiz, violations){ const p = proctorOf(quiz), v = violations.length; return { v, ded: Math.max(0, v - p.free) * p.penalty, p }; }
function rulesText(quiz){
  const p = proctorOf(quiz);
  return `Switching tabs or windows, copying, pasting, right-clicking, or bringing in content from other websites is recorded as a violation. ${p.free ? `The first ${p.free === 1 ? 'one is a warning' : p.free + ' are warnings'}; after that, ` : 'Each one '}${p.penalty ? `costs ${p.penalty} mark${p.penalty == 1 ? '' : 's'} each` : 'is reported to your teacher'}.${p.maxV ? ` After ${p.maxV} violations the quiz is submitted automatically.` : ''}`;
}

/* ======================================================================
   STUDENT  (/s/<group>)
   ====================================================================== */
const ST = { group: ROUTE.group, session: null, quizzes: [], take: null, review: null, preStart: null, busy: false };
const tokenKey = () => 'qd.student.' + ST.group;

async function studentBoot(){
  try { ST.session = JSON.parse(sstore(tokenKey()) || 'null'); } catch {}
  if (ST.session) await loadStudentQuizzes();
  renderStudent();
}
async function studentCall(name, args){
  try { return await rpc(name, { p_token: ST.session?.token, ...args }); }
  catch (e){
    if (/SESSION_EXPIRED/.test(e.message || '')){ ST.session = null; sstore(tokenKey(), null); ST.take = null; renderStudent(); toast('Your sign-in expired. Enter your roll number and PIN again.'); }
    throw e;
  }
}
async function loadStudentQuizzes(){ try { ST.quizzes = await studentCall('student_quizzes', {}); } catch (e){ if (ST.session) toast(errMsg(e)); } }
function studentView(){
  const s = ST.session;
  if (!s) return `<section class="panel" style="max-width:460px;margin:0 auto;width:100%"><div><div class="label">Student sign-in · Group ${esc(ST.group)}</div><h2>Enter your roll number and PIN</h2></div>
    <p class="muted">Use the roll number on your class list and the PIN your teacher gave you.</p>
    <label class="field"><span>Roll number</span><input type="text" id="s-roll" class="mono" autocomplete="username" autocapitalize="characters" placeholder="e.g. AIML-A-01"></label>
    <label class="field"><span>PIN</span><input type="password" id="s-pin" class="mono" inputmode="numeric" autocomplete="current-password" maxlength="8"></label>
    ${ST.loginErr ? `<div class="issues" role="alert">${esc(ST.loginErr)}</div>` : ''}
    <div class="row"><button class="btn primary" data-act="s-login">Sign in</button></div></section>`;
  if (ST.take) return examView();
  if (ST.review) return reviewView();
  const pre = ST.preStart && ST.quizzes.find(x => x.id === ST.preStart);
  if (pre) return `<section class="panel" style="max-width:640px;margin:0 auto;width:100%"><div><div class="label">Before you start · <span class="mono">${esc(s.roll)}</span></div><h2>${esc(pre.title)}</h2></div>
    <div class="qz-facts"><span><b>${pre.n}</b> questions</span><span><b>${pre.total_marks}</b> marks</span><span><b>${pre.duration_min}</b> min</span></div>
    <div class="confirm"><b>This quiz is proctored</b>
      <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
        <li>Stay on this tab. Switching tabs, opening another app or website, or minimising the window is recorded.</li>
        <li>Copying, cutting, pasting, right-clicking and dragging in text or files from other sites are blocked and recorded.</li>
        <li>The quiz opens in full screen where your browser allows it. Leaving full screen is recorded.</li>
        <li>${esc(rulesText(pre))}</li><li>Your teacher sees every violation with its time.</li></ul></div>
    <p class="small muted">The timer starts when you press Start and keeps running if you close the page.</p>
    <div class="row"><button class="btn primary" data-act="s-start-go" data-id="${pre.id}">I agree, start quiz</button><button class="btn ghost" data-act="s-pre-cancel">Back</button></div></section>`;
  return `<section class="panel"><div class="panel-head"><div><div class="label">Signed in as <span class="mono">${esc(s.roll)}</span>${s.name ? ' · ' + esc(s.name) : ''}</div><h2>Your quizzes</h2></div>
      <div class="row"><button class="btn sm" data-act="s-refresh">Refresh</button><button class="btn sm ghost" data-act="s-logout">Sign out</button></div></div>
    ${ST.quizzes.length ? `<div class="quizzes">${ST.quizzes.map(qz => {
      const a = qz.attempt; let state, btn;
      if (a?.submitted_at){ state = qz.released ? '<span class="pill info">Result out</span>' : '<span class="pill live">Submitted</span>'; btn = qz.released ? `<button class="btn sm primary" data-act="s-review" data-id="${qz.id}">See result</button>` : '<span class="small muted">Your teacher will release results.</span>'; }
      else if (qz.status !== 'live'){ state = '<span class="pill closed">Closed</span>'; btn = '<span class="small muted">This quiz is closed.</span>'; }
      else if (a){ state = '<span class="pill info">In progress</span>'; btn = `<button class="btn sm primary" data-act="s-start-go" data-id="${qz.id}">Resume</button>`; }
      else { state = '<span class="pill live">Open</span>'; btn = `<button class="btn sm primary" data-act="s-start" data-id="${qz.id}">Start quiz</button>`; }
      return `<article class="qz"><div>${state}</div><h3>${esc(qz.title)}</h3>
        <div class="qz-facts"><span><b>${qz.n}</b> questions</span><span><b>${qz.total_marks}</b> marks</span><span><b>${qz.duration_min}</b> min</span></div>
        ${!a ? '<p class="small muted">Proctored: tab switching, copy and paste cost marks.</p>' : ''}<div class="qz-actions">${btn}</div></article>`; }).join('')}</div>`
      : `<div class="empty"><h3>No open quizzes for ${esc(s.roll)}</h3><p>Quizzes appear here when your teacher sets them live. Press Refresh to check again.</p></div>`}</section>`;
}

/* exam: answers are kept on the device and synced every 15–20 s (random per student) */
const SYNC_MS = 15000 + Math.floor(Math.random() * 5000);
let pendingSync = false, lastSync = 0, syncing = null, pendingViol = [], clockOffset = 0, timerI;
function attemptKey(){ return 'qd.att.' + ST.take?.attemptId; }
function backupLocal(){ const t = ST.take; if (t) store(attemptKey(), JSON.stringify({ answers: t.answers, marked: t.marked, at: Date.now() })); }
async function startAttempt(id){
  try {
    const r = await studentCall('start_attempt', { p_quiz: id });
    const quiz = r.quiz, rand = rng(hashStr(r.attempt_id));
    const ids = quiz.questions.map(x => x.id), order = quiz.shuffle ? shuffled(ids, rand) : ids, opt = {};
    quiz.questions.forEach(x => { const idx = x.options.map((_, i) => i); opt[x.id] = quiz.shuffle ? shuffled(idx, rand) : idx; });
    clockOffset = ms(r.server_now) - Date.now();
    ST.take = { quiz, attemptId: r.attempt_id, order, opt, cur: 0, confirm: false, warn: null, deadline: ms(r.deadline),
      answers: r.answers || {}, marked: r.marked || {}, violations: r.violations || [] };
    try { const loc = JSON.parse(store(attemptKey()) || 'null'); if (loc && !r.submitted_at){ ST.take.answers = { ...ST.take.answers, ...loc.answers }; ST.take.marked = { ...ST.take.marked, ...loc.marked }; pendingSync = true; } } catch {}
    if (r.submitted_at) return finishExam(r);
    timerI = setInterval(tick, 1000); tick(); renderStudent();
  } catch (e){ toast(errMsg(e)); await loadStudentQuizzes(); renderStudent(); }
}
const now = () => Date.now() + clockOffset;
function tick(){
  if (!ST.take) return clearInterval(timerI);
  const left = ST.take.deadline - now(), el = $('#timer');
  if (el){ el.textContent = fmtTime(left); el.classList.toggle('low', left < 60000); }
  if (left <= 0) syncNow(true);
  else if (pendingSync && Date.now() - lastSync >= SYNC_MS) syncNow(false);
}
function touch(){ pendingSync = true; backupLocal(); }
async function syncNow(submit){
  if (!ST.take) return;
  if (syncing){ await syncing; if (!submit && !pendingSync) return; }
  const t = ST.take, viol = pendingViol; pendingViol = []; pendingSync = false; lastSync = Date.now();
  syncing = (async () => {
    try {
      const r = await studentCall('save_attempt', { p_quiz: t.quiz.id, p_answers: t.answers, p_marked: t.marked, p_violations: viol, p_submit: !!submit });
      clockOffset = ms(r.server_now) - Date.now();
      if (ST.take){ ST.take.violations = r.violations || ST.take.violations; ST.take.deadline = ms(r.deadline); }
      if (r.submitted_at) finishExam(r);
    } catch (e){
      pendingViol = viol.concat(pendingViol); pendingSync = true;
      if (!/SESSION_EXPIRED/.test(e.message || '')) toast('Answers are saved on this device and will sync when the connection returns.');
    } finally { syncing = null; }
  })();
  return syncing;
}
function finishExam(r){
  clearInterval(timerI);
  const auto = r.auto, closed = r.quiz_status && r.quiz_status !== 'live';
  if (ST.take) store(attemptKey(), null);
  ST.take = null;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  toast(!auto ? 'Submitted. Your answers are recorded.' : closed ? 'Your teacher closed this quiz, so your answers were submitted.' : 'Your quiz was submitted automatically.');
  loadStudentQuizzes().then(renderStudent);
}
function examView(){
  const t = ST.take, quiz = t.quiz, qid = t.order[t.cur], item = quiz.questions.find(x => x.id === qid);
  const answered = t.order.filter(id => t.answers[id] !== undefined).length, unanswered = t.order.length - answered;
  const pen = penaltyOf(quiz, t.violations), tabs = t.violations.filter(v => v.t === 'tab').length, w = t.warn;
  const warnBar = w ? `<div class="warnbar" role="alert"><div><b>Violation recorded: ${esc(VIOL_LABEL[w] || w)}.</b>
      ${pen.v <= pen.p.free ? `This was warning ${pen.v} of ${pen.p.free}. The next one costs marks.` : `${pen.ded} mark${pen.ded == 1 ? '' : 's'} deducted so far.`}
      ${pen.p.maxV ? `The quiz is submitted automatically at ${pen.p.maxV} violations (you have ${pen.v}).` : ''}</div>
      <button class="btn sm" data-act="s-warn-ok">Back to quiz</button></div>` : '';
  return `${warnBar}<div class="exam-head"><div><div class="label">${esc(ST.session.roll)} · ${quiz.total_marks} marks</div><h2>${esc(quiz.title)}</h2></div>
      <div class="row"><span class="pill ${tabs ? 'bad' : 'draft'}">Tab switches: ${tabs}</span><span class="pill ${pen.v ? 'bad' : 'draft'}" title="${esc(rulesText(quiz))}">${pen.v} violation${pen.v === 1 ? '' : 's'}${pen.ded ? ` · −${pen.ded}` : ''}</span><span class="small muted">${answered}/${t.order.length} answered</span><span class="timer" id="timer" role="timer">${fmtTime(t.deadline - now())}</span></div></div>
    <div class="exam">
      <section class="panel">
        <div class="qmeta"><span class="mono">Question ${t.cur + 1} of ${t.order.length}</span><span>${item.marks} mark${item.marks == 1 ? '' : 's'}</span><span>${esc(item.topic)}</span></div>
        <p class="qtext">${esc(item.text)}</p>
        <div class="choices" role="group" aria-label="Options">${t.opt[qid].map((orig, i) => `<button class="choice" data-act="s-pick" data-v="${orig}" aria-pressed="${t.answers[qid] === orig}"><span class="bub">${LETTERS[i]}</span><span>${esc(item.options[orig])}</span></button>`).join('')}</div>
        <div class="row" style="justify-content:space-between">
          <div class="row"><button class="btn" data-act="s-prev" ${t.cur ? '' : 'disabled'}>Previous</button><button class="btn" data-act="s-next" ${t.cur < t.order.length - 1 ? '' : 'disabled'}>Next</button></div>
          <div class="row"><button class="btn ghost sm" data-act="s-mark">${t.marked[qid] ? 'Unmark review' : 'Mark for review'}</button>${t.answers[qid] !== undefined ? '<button class="btn ghost sm" data-act="s-clear">Clear answer</button>' : ''}</div>
        </div>
        <p class="small muted">Keys: A–${LETTERS[item.options.length - 1]} to choose, ← → to move.</p>
      </section>
      <aside class="panel"><div class="label">Answer sheet</div>

async function studentAct(a, el){
  const id = el?.dataset.id, t = ST.take;
  switch (a){
    case 's-login': {
      const roll = $('#s-roll').value.trim(), pin = $('#s-pin').value.trim();
      if (!roll || !pin){ ST.loginErr = 'Enter your roll number and PIN.'; return renderStudent(); }
      el.disabled = true;
      try { const r = await rpc('student_login', { p_group: ST.group, p_roll: roll, p_pin: pin }); if (r.error){ ST.loginErr = r.hint; return renderStudent(); } ST.session = r; sstore(tokenKey(), JSON.stringify(ST.session)); ST.loginErr = ''; await loadStudentQuizzes(); }
      catch (e){ ST.loginErr = errMsg(e); }
      renderStudent(); break; }
    case 's-logout': try { await rpc('student_logout', { p_token: ST.session.token }); } catch {} ST.session = null; sstore(tokenKey(), null); renderStudent(); break;
    case 's-refresh': await loadStudentQuizzes(); renderStudent(); toast('Up to date.'); break;
    case 's-start': ST.preStart = id; renderStudent(); break;
    case 's-pre-cancel': ST.preStart = null; renderStudent(); break;
    case 's-start-go': ST.preStart = null; enterFullscreen(); el.disabled = true; await startAttempt(id); break;
    case 's-warn-ok': if (t){ t.warn = null; enterFullscreen(); renderStudent(); } break;
    case 's-review': try { ST.review = await studentCall('student_result', { p_quiz: id }); } catch (e){ return toast(errMsg(e)); } renderStudent(); break;
    case 's-back': ST.review = null; renderStudent(); break;
    case 's-pick': t.answers[t.order[t.cur]] = +el.dataset.v; touch(); renderStudent(); break;
    case 's-clear': delete t.answers[t.order[t.cur]]; touch(); renderStudent(); break;
    case 's-mark': { const k = t.order[t.cur]; t.marked[k] = !t.marked[k]; if (!t.marked[k]) delete t.marked[k]; touch(); renderStudent(); break; }
    case 's-prev': t.cur = Math.max(0, t.cur - 1); renderStudent(); break;
    case 's-next': t.cur = Math.min(t.order.length - 1, t.cur + 1); renderStudent(); break;
    case 's-goto': t.cur = +el.dataset.i; renderStudent(); break;
    case 's-submit-ask': t.confirm = true; renderStudent(); break;
    case 's-submit-no': t.confirm = false; renderStudent(); break;
    case 's-submit-yes': el.disabled = true; await syncNow(true); if (ST.take){ el.disabled = false; toast('Couldn\'t reach the server. Your answers are safe on this device; press Submit again.'); } break;
  }
}
/* proctoring engine: active only during an exam */
const lastViol = {};
function violation(type, extra){
  const t = ST.take; if (!t) return;
  const n = Date.now(); if (n - (lastViol[type] || 0) < 3000) return; lastViol[type] = n;
  const v = { t: type, at: n, ...(extra || {}) };
  t.violations = t.violations.concat([v]); pendingViol.push(v); t.warn = type;
  const p = proctorOf(t.quiz);
  syncNow(false);   // violations are sent at once; the server applies the auto-submit limit
  if (!(p.maxV && t.violations.length >= p.maxV)) renderStudent();
}
let awayAt = 0, awayHidden = false;
function goneAway(hidden){ if (!ST.take) return; if (!awayAt) awayAt = Date.now(); if (hidden){ awayHidden = true; if (pendingSync) syncNow(false); } }
function cameBack(){ if (!ST.take || !awayAt) return; const d = Date.now() - awayAt, h = awayHidden; awayAt = 0; awayHidden = false; if (h || d > 1500) violation('tab', { secs: Math.round(d / 1000) }); }
document.addEventListener('visibilitychange', () => document.hidden ? goneAway(true) : cameBack());
window.addEventListener('blur', () => goneAway(false));
window.addEventListener('focus', cameBack);
[['copy', 'copy'], ['cut', 'cut'], ['paste', 'paste'], ['contextmenu', 'menu'], ['drop', 'drop']].forEach(([ev, type]) =>
  document.addEventListener(ev, e => { if (!ST.take) return; e.preventDefault(); violation(type); }, true));
['dragover', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (ST.take) e.preventDefault(); }, true));
document.addEventListener('keyup', e => { if (ST.take && e.key === 'PrintScreen') violation('screenshot'); });
function enterFullscreen(){ try { const p = document.documentElement.requestFullscreen?.(); if (p) p.then(() => { if (ST.take) ST.take.fs = true; }).catch(() => {}); } catch {} }
document.addEventListener('fullscreenchange', () => { const t = ST.take; if (!t) return; if (document.fullscreenElement) t.fs = true; else if (t.fs){ t.fs = false; violation('fullscreen'); } });
window.addEventListener('pagehide', () => { if (ST.take && pendingSync) syncNow(false); });
document.addEventListener('keydown', e => {
  const t = ST.take; if (!t || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const qid = t.order[t.cur], n = t.quiz.questions.find(x => x.id === qid).options.length, i = LETTERS.indexOf(e.key.toUpperCase());
  if (i >= 0 && i < n){ t.answers[qid] = t.opt[qid][i]; touch(); renderStudent(); }
  else if (e.key === 'ArrowRight' && t.cur < t.order.length - 1){ t.cur++; renderStudent(); }

});

/* results & analytics (same rules as the claude.ai version) */
function results(quiz){
  const key = Object.fromEntries(quiz.questions.map(x => [x.id, x.answer]));
  const byId = new Map(F.students.map(s => [s.id, s]));
  const vio = new Map(); F.violations.forEach(v => { if (!vio.has(v.attempt_id)) vio.set(v.attempt_id, []); vio.get(v.attempt_id).push({ t: v.type, at: ms(v.at), secs: v.secs }); });
  const rows = F.attempts.filter(a => a.quiz_id === quiz.id).map(a => {
    const st = byId.get(a.student_id) || { roll: '(removed student)', name: '', division: '' };
    let raw = 0, correct = 0, attempted = 0;
    for (const x of quiz.questions){ const v = a.answers?.[x.id]; if (v !== undefined && v !== null){ attempted++; if (v === key[x.id]){ raw += +x.marks || 1; correct++; } } }
    const violations = vio.get(a.id) || [], pen = penaltyOf(quiz, violations), tabEv = violations.filter(v => v.t === 'tab');
    const score = Math.max(0, raw - pen.ded), sub = ms(a.submitted_at);
    return { roll: st.roll, name: st.name, division: st.division, score, raw, ded: pen.ded, viol: pen.v, violations, tabs: tabEv.length, awaySecs: tabEv.reduce((s, v) => s + (v.secs || 0), 0),
      correct, attempted, pct: pct(score, quiz.total_marks), submitted: !!sub, auto: a.auto, startedAt: ms(a.started_at), submittedAt: sub, taken: sub ? sub - ms(a.started_at) : null, answers: a.answers || {} };
  }).sort((a, b) => b.score - a.score || (a.taken ?? 9e15) - (b.taken ?? 9e15));
  const seen = new Set(rows.map(r => r.roll));
  const missing = quiz.assigned_rolls.filter(r => !seen.has(r));
  const perQ = quiz.questions.map(x => { const done = rows.filter(r => r.submitted); const c = done.filter(r => r.answers[x.id] === key[x.id]).length; return { q: x, rate: done.length ? c / done.length : 0, n: done.length }; });
  return { rows, missing, perQ, key };
}
const LEVELS = [
  { k: 'slow', label: 'Slow learners', color: 'var(--bad)', action: 'Remedial session on the weakest topics, extra practice quizzes, and a follow-up re-test.' },
  { k: 'average', label: 'Average learners', color: 'var(--warn)', action: 'Targeted practice on the weak topics shown below, and peer study with advanced learners.' },
  { k: 'advanced', label: 'Advanced learners', color: 'var(--ok)', action: 'Content beyond the syllabus, harder questions, projects, and peer mentoring of slow learners.' },
];
function learnerData(scope){
  const { lo, hi } = F.la; scope = scope || F.la.scope;
  const quizzes = scope === 'all' ? F.quizzes : F.quizzes.filter(x => x.id === scope);
  const byId = new Map(F.students.map(s => [s.id, s])), per = new Map();
  for (const quiz of quizzes){
    const key = Object.fromEntries(quiz.questions.map(x => [x.id, x.answer]));
    for (const a of F.attempts.filter(a => a.quiz_id === quiz.id && a.submitted_at)){
      const st = byId.get(a.student_id); if (!st) continue;
      const e = per.get(st.roll) || { roll: st.roll, name: st.name, division: st.division, pcts: [], topic: {} };
      let raw = 0;
      for (const x of quiz.questions){ const ok = a.answers?.[x.id] === key[x.id], t = x.topic || 'General'; if (ok) raw += +x.marks || 1; e.topic[t] = e.topic[t] || { c: 0, n: 0 }; e.topic[t].n++; if (ok) e.topic[t].c++; }
      e.pcts.push(pct(raw, quiz.total_marks)); per.set(st.roll, e);
    }
  }
  const rows = [...per.values()].map(e => {
    const avg = Math.round(e.pcts.reduce((s, x) => s + x, 0) / e.pcts.length * 10) / 10;
    const ts = Object.entries(e.topic).map(([t, v]) => ({ t, acc: v.c / v.n })).sort((a, b) => a.acc - b.acc);
    return { ...e, avg, n: e.pcts.length, level: avg < lo ? 'slow' : avg >= hi ? 'advanced' : 'average', weakest: ts[0], strongest: ts[ts.length - 1] };
  }).sort((a, b) => a.avg - b.avg);
  const assigned = scope === 'all' ? F.students.map(s => s.roll) : (quizzes[0]?.assigned_rolls || []);
  const noData = assigned.filter(r => !per.has(r));
  const topics = [...new Set(quizzes.flatMap(x => x.questions.map(y => y.topic || 'General')))].sort();
  const topicAcc = (list, t) => { let c = 0, n = 0; list.forEach(r => { const v = r.topic[t]; if (v){ c += v.c; n += v.n; } }); return n ? c / n : null; };
  return { rows, noData, topics, topicAcc, quizzes };
}

async function handleUpload(kind, source){
  try {
    const rows = typeof source === 'string' ? parseCSV(source) : await fileRows(source);

    const res = kind === 'students' ? parseStudents(rows) : parseQuestions(rows);
    if (res.error) throw new Error(res.error);
    F.pending = { kind, rows: res.rows, issues: res.issues, mode: 'merge', name: typeof source === 'string' ? 'Pasted text' : source.name };
  } catch (e){ F.pending = { kind, error: e.message || String(e) }; }
  renderFaculty();
}
async function savePending(){
  const p = F.pending;
  if (p.kind === 'students'){
    if (p.mode === 'replace'){
      const keep = new Set(p.rows.map(r => r.roll)), gone = F.students.filter(s => !keep.has(s.roll)).map(s => s.id);
      if (gone.length) await q(sb.from('students').delete().in('id', gone));
    }
    await q(sb.from('students').upsert(p.rows.map(r => ({ group_id: F.group, ...r })), { onConflict: 'group_id,roll' }));
    logAct('Uploaded student list', `${p.rows.length} rows from ${p.name} into Group ${F.group}, ${p.mode === 'replace' ? 'replaced list' : 'merged'}`);
    toast(`Saved ${p.rows.length} students in Group ${F.group}. Next: create PINs.`);
  } else {
    const added = await rpc('import_questions', { p_rows: p.rows });
    logAct('Uploaded questions', `${added} added from ${p.name}; ${p.rows.length - added} duplicates skipped`);
    toast(`Added ${added} questions to the shared bank${p.rows.length - added ? `; skipped ${p.rows.length - added} duplicates` : ''}.`);
  }
  F.pending = null; await loadAll(); renderFaculty();
}

        </tbody></table></div>` : '<p class="muted">No students in this group.</p>'}</section>`; }).join('')
    + `<section class="panel"><div><div class="label">Topic accuracy by learner level · red is under 40%</div><h3>Where each group needs help</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Topic</th>${LEVELS.map(L => `<th class="num" style="color:${L.color}">${L.label.split(' ')[0]}</th>`).join('')}<th class="num">Whole class</th></tr></thead><tbody>
        ${d.topics.map(t => `<tr><td>${esc(t)}</td>${LEVELS.map(L => accCell(d.topicAcc(by[L.k], t))).join('')}${accCell(d.topicAcc(d.rows, t))}</tr>`).join('')}</tbody></table></div></section>`;
}

  on('grp', 'change', async e => {
    F.group = e.target.value; store('qd.group', F.group); F.pending = null; F.pins = null; F.activity = null; F.resultsQuiz = null; F.builder.divisions = [];

async function facultyAct(a, el){
  const id = el?.dataset.id, v = el?.dataset.v;

  switch (a){
    case 'f-mode': F.authMode = v; F.authErr = ''; renderFaculty(); break;
    case 'f-login': await guard(async () => {
      const { data, error } = await sb.auth.signInWithPassword({ email: $('#fa-email').value.trim(), password: $('#fa-pass').value });
      if (error){
        F.unconfirmed = /not confirmed/i.test(error.message) ? $('#fa-email').value.trim() : '';
        F.authErr = error.message === 'Invalid login credentials' ? 'Wrong email or password.' : F.unconfirmed ? 'Your email is not confirmed yet. Open the confirmation email from Supabase (check spam too) and click its link, or send a new one.' : error.message;
        return renderFaculty(); }
      F.unconfirmed = '';
      F.user = data.user; F.authErr = ''; await loadMe(); if (F.me?.status === 'active') logAct('Logged in'); renderFaculty(); }); break;
    case 'f-signup': await guard(async () => {
      const email = $('#fa-email').value.trim(), password = $('#fa-pass').value;
      if (password.length < 8){ F.authErr = 'Use at least 8 characters for the password.'; return renderFaculty(); }
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error){ F.authErr = /rate limit|security purposes/i.test(error.message) ? 'Too many sign-up emails sent recently. Wait a few minutes and try again.' : /registered/i.test(error.message) ? 'That email already has an account. Log in instead, or use "Forgot password?".' : error.message; return renderFaculty(); }
      if (!data.session){ F.authMode = 'signin'; F.unconfirmed = email; F.authErr = `Account created. Supabase has emailed ${email} a confirmation link (check spam). Click it, then come back and log in.`; return renderFaculty(); }
      F.user = data.user; F.authErr = ''; await loadMe(); renderFaculty(); }); break;
    case 'f-resend': await guard(async () => {
      const { error } = await sb.auth.resend({ type: 'signup', email: F.unconfirmed, options: { emailRedirectTo: location.origin + location.pathname } });
      F.authErr = error ? (/rate limit|security purposes/i.test(error.message) ? 'Too many emails sent recently. Wait a few minutes, or ask the Supabase owner to turn off email confirmation.' : error.message) : `A new confirmation email is on its way to ${F.unconfirmed}. Check spam too.`;
      renderFaculty(); }); break;
    case 'f-forgot': await guard(async () => {
      const { error } = await sb.auth.resetPasswordForEmail($('#fa-email').value.trim(), { redirectTo: location.origin + location.pathname });
      F.authErr = error ? error.message : ''; if (!error){ toast('If that email has an account, a reset link is on its way.'); F.authMode = 'signin'; } renderFaculty(); }); break;
    case 'f-recover': await guard(async () => {
      const p = $('#fa-new').value; if (p.length < 8){ F.authErr = 'Use at least 8 characters.'; return renderFaculty(); }
      const { error } = await sb.auth.updateUser({ password: p }); if (error){ F.authErr = error.message; return renderFaculty(); }
      F.recovery = false; F.authErr = ''; const { data } = await sb.auth.getUser(); F.user = data.user; await loadMe(); toast('Password changed.'); renderFaculty(); }); break;
    case 'f-register': await guard(async () => { await rpc('register_faculty', { p_name: $('#fa-name').value }); F.authErr = ''; await loadMe(); renderFaculty(); }); break;
    case 'f-reload': await loadMe(); renderFaculty(); break;
    case 'f-logout': if (F.me?.status === 'active') await logAct('Logged out'); await sb.auth.signOut(); F.user = null; F.me = null; F.panel = false; renderFaculty(); break;
    case 'f-panel': F.panel = !F.panel; F.authErr = ''; if (F.panel && F.me.role === 'admin') F.faculty = await q(sb.from('faculty').select('*').order('created_at')).catch(() => F.faculty); renderFaculty(); break;
    case 'f-my-pass': await guard(async () => { const p = $('#my-new').value; if (p.length < 8){ F.authErr = 'Use at least 8 characters.'; return renderFaculty(); } const { error } = await sb.auth.updateUser({ password: p }); if (error) throw error; F.authErr = ''; logAct('Changed own password'); toast('Password changed.'); renderFaculty(); }); break;
    case 'f-acct': await guard(async () => { const t = F.faculty.find(x => x.user_id === id); await q(sb.from('faculty').update({ status: v, approved_by: F.user.id }).eq('user_id', id)); logAct(v === 'active' ? (t.status === 'pending' ? 'Approved faculty' : 'Enabled account') : 'Disabled account', `${t.name} (${t.email})`); F.faculty = await q(sb.from('faculty').select('*').order('created_at')); renderFaculty(); }); break;
    case 'f-role': await guard(async () => { const t = F.faculty.find(x => x.user_id === id); await q(sb.from('faculty').update({ role: v }).eq('user_id', id)); logAct(v === 'admin' ? 'Made administrator' : 'Made faculty', `${t.name} (${t.email})`); F.faculty = await q(sb.from('faculty').select('*').order('created_at')); renderFaculty(); }); break;
    case 'f-acct-rm': await guard(async () => { const t = F.faculty.find(x => x.user_id === id); await q(sb.from('faculty').delete().eq('user_id', id)); logAct('Removed account', `${t.name} (${t.email})`); F.confirm = null; F.faculty = await q(sb.from('faculty').select('*').order('created_at')); renderFaculty(); }); break;
    case 'f-confirm': F.confirm = v; renderFaculty(); break;
    case 'f-confirm-no': F.confirm = null; renderFaculty(); break;
    case 'f-cancel-pending': F.pending = null; renderFaculty(); break;
    case 'f-save-pending': await guard(savePending); break;
    case 'f-read-paste': { const t = $('#paste-' + el.dataset.kind).value; if (!t.trim()) return toast('Paste rows first, with the header row on top.'); handleUpload(el.dataset.kind, t); break; }
    case 'f-pins-missing': await guard(() => makePins(F.students.filter(s => !s.pin_set))); break;
    case 'f-pins-all': F.confirm = null; await guard(() => makePins(F.students)); break;
    case 'f-pin-one': await guard(() => makePins(F.students.filter(s => s.id === id))); break;
    case 'f-pins-close': F.pins = null; renderFaculty(); break;
    case 'f-pins-save': savePinsWorkbook(); break;
    case 'f-rm-student': await guard(async () => { const s = F.students.find(x => x.id === id); await q(sb.from('students').delete().eq('id', id)); logAct('Removed student', s?.roll); F.confirm = null; await loadAll(); renderFaculty(); }); break;
    case 'f-rm-q': await guard(async () => { const x = F.bank.find(y => y.id === id); await q(sb.from('questions').delete().eq('id', id)); logAct('Removed question', x?.text); F.confirm = null; await loadAll(); renderFaculty(); }); break;
    case 'f-create-quiz': await guard(createQuiz); break;
    case 'f-live': await guard(async () => { const x = F.quizzes.find(y => y.id === id); await rpc('set_quiz_status', { p_quiz: id, p_status: 'live' }); logAct(x.status === 'closed' ? 'Reopened quiz' : 'Started quiz', x.title); toast('Quiz is live. Students on its list can start now.'); await loadAll(); renderFaculty(); }); break;
    case 'f-close': await guard(async () => { const x = F.quizzes.find(y => y.id === id); await rpc('set_quiz_status', { p_quiz: id, p_status: 'closed' }); logAct('Closed quiz', x.title); toast('Quiz closed. Anyone still answering was submitted.'); await loadAll(); renderFaculty(); }); break;
    case 'f-release': await guard(async () => { const x = F.quizzes.find(y => y.id === id); await q(sb.from('quizzes').update({ released: !x.released }).eq('id', id)); logAct(x.released ? 'Hid results' : 'Released results', x.title); toast(x.released ? 'Results hidden from students.' : 'Results released. Students can now see scores and correct answers.'); await loadAll(); renderFaculty(); }); break;
    case 'f-del-quiz': await guard(async () => { const x = F.quizzes.find(y => y.id === id); await q(sb.from('quizzes').delete().eq('id', id)); logAct('Deleted quiz', x.title); F.confirm = null; await loadAll(); renderFaculty(); }); break;
    case 'f-results': F.resultsQuiz = id; F.tab = 'results'; renderFaculty(); break;
    case 'f-activity-refresh': F.activity = null; renderFaculty(); break;
    case 'f-export': exportResultsCSV(F.quizzes.find(x => x.id === F.resultsQuiz)); break;
    case 'f-la-export': exportLearnersCSV(); break;
    case 'f-save-all': await guard(saveAllWorkbook); break;
    case 'f-copy': { const box = $('#' + el.dataset.box);
      navigator.clipboard.writeText(box.value).then(() => toast('Link copied.')).catch(() => { box.focus(); box.select(); toast('Press Ctrl+C (Cmd+C on Mac) to copy.'); }); break; }
  }
}
async function createQuiz(){
  const b = F.builder, pool = builderPool();
  if (!b.title.trim()) return toast('Give the quiz a title.');
  const n = Math.min(Math.max(1, +b.count || pool.length), pool.length);
  const picked = shuffled(pool, Math.random).slice(0, n);
  const assigned = F.students.filter(s => !b.divisions.length || b.divisions.includes(s.division));
  if (!assigned.length) return toast('Upload this group\'s student list first.');
  const row = { group_id: F.group, title: b.title.trim(), duration_min: Math.max(1, +b.duration || 20), shuffle: !!b.shuffle,
    proctor: { penalty: Math.max(0, +b.penalty || 0), free: Math.max(0, Math.floor(+b.free || 0)), maxV: Math.max(0, Math.floor(+b.maxV || 0)) },
    questions: picked.map(x => ({ id: x.id, text: x.text, options: x.options, answer: x.answer, marks: +x.marks, topic: x.topic })),
    total_marks: picked.reduce((a, x) => a + (+x.marks || 1), 0), assigned_rolls: assigned.map(s => s.roll), divisions: b.divisions.slice(),
    created_by: F.user.id, created_by_name: F.me.name };
  await q(sb.from('quizzes').insert(row));
  logAct('Created quiz', `${row.title}: ${picked.length} questions, ${row.duration_min} min, ${assigned.length} students`);
  toast(`Created "${row.title}" as a draft. Press Go live when students are ready.`);
  F.builder.title = ''; await loadAll(); renderFaculty();
}

async function saveFile(filename, wbOrText){
  try { if (typeof wbOrText === 'string'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([wbOrText], { type: 'text/csv' })); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } else XLSX.writeFile(wbOrText, filename); toast(`Saved ${filename}.`); }
  catch { toast('Couldn\'t save the file.'); }
}
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
function exportResultsCSV(quiz){
  const { rows, missing } = results(quiz), rm = new Map(F.students.map(s => [s.roll, s]));
  const lines = [['Rank','Roll No','Name','Division','Final score','Out of','Percent','Marks before penalty','Tab switches','Time away (s)','Violations','Marks deducted','Correct','Attempted','Status','Time taken','Submitted at'].join(',')];
  rows.forEach((r, i) => lines.push([i + 1, r.roll, r.name, r.division, r.score, quiz.total_marks, r.pct, r.raw, r.tabs, r.awaySecs, r.viol, r.ded, r.correct, r.attempted, r.submitted ? (r.auto ? 'Auto-submitted' : 'Submitted') : 'In progress', r.taken ? fmtTime(r.taken) : '', r.submittedAt ? new Date(r.submittedAt).toISOString() : ''].map(csvCell).join(',')));
  missing.forEach(roll => lines.push(['', roll, rm.get(roll)?.name || '', rm.get(roll)?.division || '', 0, quiz.total_marks, 0, 0, 0, 0, 0, 0, 0, 0, 'Absent', '', ''].map(csvCell).join(',')));
  logAct('Exported results', quiz.title);
  saveFile(`Group-${F.group}-${quiz.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-')}-results.csv`, lines.join('\n'));
}
function exportLearnersCSV(){

async function saveAllWorkbook(){
  if (!window.XLSX) return toast('The Excel writer did not load. Use Export CSV instead.');
  await loadAll();
  let activity = [];
  try { activity = await q(sb.from('activity').select('*').or(`group_id.eq.${F.group},group_id.is.null`).order('at', { ascending: false }).limit(1000)); } catch {}
  const when = t => t ? new Date(t).toLocaleString() : '', rm = new Map(F.students.map(s => [s.roll, s]));
  const wb = XLSX.utils.book_new(), used = new Set();
  const add = (name, rows, widths) => { let n = name.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim() || 'Sheet', base = n, i = 2; while (used.has(n.toLowerCase())) n = base.slice(0, 28) + ' ' + i++; used.add(n.toLowerCase()); const ws = XLSX.utils.aoa_to_sheet(rows); if (widths) ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, n); };
  const quizzes = F.quizzes.slice().sort((a, b) => ms(a.created_at) - ms(b.created_at)), R = new Map(quizzes.map(x => [x.id, results(x)]));
  const summary = [[`Quiz Desk · Group ${F.group} · all results`], [`Saved ${when(new Date())} by ${F.me.name}`], [`Students: ${F.students.length} · Shared bank: ${F.bank.length} questions · Quizzes: ${quizzes.length}`], [],
    ['Quiz', 'Status', 'Created by', 'Started by', 'Started at', 'Questions', 'Total marks', 'Minutes', 'Assigned', 'Submitted', 'Not started', 'Average %', 'Highest', 'Lowest', 'Scored 40%+', 'Tab switches', 'Students with violations', 'Results released']];
  quizzes.forEach(x => { const { rows, missing } = R.get(x.id), done = rows.filter(r => r.submitted), sc = done.map(r => r.score);
    summary.push([x.title, x.status, x.created_by_name, x.started_by_name, when(x.started_at), x.questions.length, x.total_marks, x.duration_min, x.assigned_rolls.length, done.length, missing.length,
      done.length ? Math.round(done.reduce((s, r) => s + r.pct, 0) / done.length * 10) / 10 : '', sc.length ? Math.max(...sc) : '', sc.length ? Math.min(...sc) : '', done.filter(r => r.pct >= 40).length, rows.reduce((s, r) => s + r.tabs, 0), rows.filter(r => r.viol).length, x.released ? 'Yes' : 'No']); });
  add('Summary', summary, [34, 9, 18, 18, 20, 10, 11, 8, 9, 10, 11, 10, 8, 8, 11, 12, 14, 10]);
  quizzes.forEach((x, qi) => { const { rows, missing } = R.get(x.id);
    const out = [[x.title], [`${x.questions.length} questions · ${x.total_marks} marks · ${x.duration_min} min · ${x.status}${x.started_by_name ? ' · started by ' + x.started_by_name + ' at ' + when(x.started_at) : ''}`], [],
      ['Rank', 'Roll No', 'Name', 'Division', 'Final score', 'Out of', 'Percent', 'Marks before penalty', 'Marks deducted', 'Correct', 'Attempted', 'Tab switches', 'Time away (s)', 'Violations', 'Status', 'Time taken', 'Submitted at']];
    rows.forEach((r, i) => out.push([i + 1, r.roll, r.name, r.division, r.score, x.total_marks, r.pct, r.raw, r.ded, r.correct, r.attempted, r.tabs, r.awaySecs, r.viol, r.submitted ? (r.auto ? 'Auto-submitted' : 'Submitted') : 'In progress', r.taken ? fmtTime(r.taken) : '', when(r.submittedAt)]));
    missing.forEach(roll => out.push(['', roll, rm.get(roll)?.name || '', rm.get(roll)?.division || '', '', x.total_marks, '', '', '', '', '', '', '', '', 'Not started', '', '']));
    add(`${qi + 1} ${x.title}`, out, [6, 14, 22, 9, 10, 7, 8, 12, 10, 8, 9, 11, 11, 10, 14, 10, 20]); });
  const qa = [['Quiz', 'Q#', 'Question', 'Topic', 'Marks', 'Correct option', 'Correct answer', 'Students answered', '% correct']];
  quizzes.forEach(x => { const { rows, perQ, key } = R.get(x.id), done = rows.filter(r => r.submitted);
    perQ.forEach((p, i) => qa.push([x.title, i + 1, p.q.text, p.q.topic || 'General', p.q.marks, LETTERS[key[p.q.id]] || '', p.q.options[key[p.q.id]] ?? '', done.filter(r => r.answers[p.q.id] !== undefined).length, done.length ? Math.round(p.rate * 100) : ''])); });
  add('Question analysis', qa, [28, 5, 70, 18, 7, 9, 30, 10, 10]);
  const d = learnerData('all'), lvl = { slow: 'Slow', average: 'Average', advanced: 'Advanced' };
  const ll = [[`Learner levels · average across all quizzes · slow below ${F.la.lo}%, advanced from ${F.la.hi}% · marks before proctoring deductions`], [], ['Roll No', 'Name', 'Division', 'Learner level', 'Average %', 'Quizzes submitted', 'Weakest topic', 'Weakest %', 'Strongest topic', 'Strongest %', 'Suggested action']];
  d.rows.forEach(r => ll.push([r.roll, r.name, r.division, lvl[r.level], r.avg, r.n, r.weakest?.t || '', r.weakest ? Math.round(r.weakest.acc * 100) : '', r.strongest?.t || '', r.strongest ? Math.round(r.strongest.acc * 100) : '', LEVELS.find(L => L.k === r.level).action]));
  d.noData.forEach(r => ll.push([r, rm.get(r)?.name || '', rm.get(r)?.division || '', 'Not assessed', '', 0, '', '', '', '', '']));
  add('Learner levels', ll, [14, 22, 9, 13, 10, 10, 20, 10, 20, 11, 60]);
  const byL = Object.fromEntries(LEVELS.map(L => [L.k, d.rows.filter(r => r.level === L.k)])), pb = a => a === null ? '' : Math.round(a * 100);
  add('Topic by level', [['Topic accuracy (%) by learner level'], [], ['Topic', 'Slow', 'Average', 'Advanced', 'Whole class'], ...d.topics.map(t => [t, ...LEVELS.map(L => pb(d.topicAcc(byL[L.k], t))), pb(d.topicAcc(d.rows, t))])], [26, 9, 9, 10, 12]);
  const vio = [['Quiz', 'Roll No', 'Name', 'Time', 'Violation', 'Seconds away']];
  quizzes.forEach(x => R.get(x.id).rows.forEach(r => r.violations.forEach(v => vio.push([x.title, r.roll, r.name, when(v.at), VIOL_LABEL[v.t] || v.t, v.secs || '']))));
  add('Violations', vio, [28, 14, 22, 20, 30, 12]);
  add('Students', [['Roll No', 'Name', 'Email', 'Division', 'PIN set'], ...F.students.map(s => [s.roll, s.name, s.email, s.division, s.pin_set ? 'Yes' : 'No'])], [14, 24, 30, 9, 8]);
  add('Activity', [['When', 'Faculty', 'Action', 'Details'], ...activity.map(e => [when(e.at), e.name, e.action, e.detail])], [20, 22, 24, 60]);
  const filename = `Group-${F.group}-all-results-${today()}.xlsx`;
  logAct('Saved all results', `${quizzes.length} quizzes, ${filename}`);
  saveFile(filename, wb);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ F.tab = tab.dataset.tab; if (!F.resultsOnly) store('qd.tab', F.tab); F.pending = null; renderFaculty(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a.startsWith('s-')) studentAct(a, b); else if (a.startsWith('f-')) facultyAct(a, b);
});
(function start(){
  if (!sb){ $('#view').innerHTML = `<section class="panel"><div class="empty"><h3>Quiz Desk isn't connected yet</h3><p>${window.supabase ? 'The database settings (config.js) are missing.' : 'The database library could not load. Check your internet connection and reload.'}</p></div></section>`; return; }
  if (ROUTE.mode === 'home'){ location.replace('/'); return; }
  document.title = `Quiz Desk · Group ${ROUTE.group || F.group} · ${ROUTE.mode === 's' ? 'Student' : ROUTE.mode === 'r' ? 'Results' : 'Faculty'}`;
  if (ROUTE.mode === 's'){ if (!ST.group){ $('#view').innerHTML = '<section class="panel"><div class="empty"><h3>This link is missing its group</h3><p>Ask your teacher for your group\'s student link.</p></div></section>'; return; } studentBoot(); }
  else facultyBoot();
})();
